<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ノート印刷 | NEET NOTE</title>
<script>window.__NEET_MENU_V4_LOADER__=true;</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f1ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
.screen-bar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));background:rgba(255,255,255,.97);border-bottom:1px solid #ddd}
.screen-bar button{min-height:44px;padding:8px 15px;border-radius:11px;font:inherit;font-weight:800}
.screen-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:146px}
.back{border:1px solid #d2cec7;background:#fff;color:#333}
.print{border:0;background:#24211e;color:#fff}
.pdf{border:1px solid #c9c2b8;background:#fff;color:#24211e}
.pdf[disabled]{opacity:.58;cursor:wait}
.paper{width:min(210mm,calc(100% - 24px));min-height:297mm;margin:18px auto;padding:15mm;background:#fff;box-shadow:0 5px 28px rgba(0,0,0,.12);overflow:hidden}
h1{margin:0 0 5mm;font-size:26pt;line-height:1.2;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2mm 6mm;margin:0 0 4mm;padding:0 0 3mm;border-bottom:1px solid #bbb;font-size:10.5pt}
.section{margin-top:7mm}
.section h2{margin:0 0 3mm;padding-bottom:2mm;border-bottom:1px solid #bbb;font-size:13pt}
.chord-viewport{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.section pre{margin:0;display:block;white-space:pre!important;overflow-wrap:normal!important;word-break:normal!important;hyphens:none!important;font-family:"SFMono-Regular",Menlo,Monaco,Consolas,"Liberation Mono","Noto Sans Mono CJK JP",monospace;font-size:.9rem;line-height:1.75;letter-spacing:normal;tab-size:2;font-variant-ligatures:none;text-rendering:geometricPrecision}
.empty{padding:30px;text-align:center;color:#666}
body.pdf-exporting{background:#fff!important}
body.pdf-exporting .screen-bar{visibility:hidden!important}
body.pdf-exporting .paper{width:210mm!important;min-height:297mm!important;margin:0!important;padding:15mm!important;box-shadow:none!important;overflow:visible!important}
body.pdf-exporting .chord-viewport{overflow:visible!important;padding:0!important}
body.pdf-exporting .section pre{overflow:visible!important;max-width:none!important}
@media(max-width:600px){
  .screen-bar{padding-top:max(10px,env(safe-area-inset-top));gap:8px}
  .screen-bar button{padding:8px 12px}
  .screen-actions{min-width:138px}
  .paper{width:calc(100% - 12px);min-height:0;margin:8px auto 18px;padding:18px 14px 28px}
  h1{font-size:22pt;margin-bottom:14px}
  .meta{gap:6px 14px;margin-bottom:12px;padding-bottom:10px;font-size:.9rem}
  .section{margin-top:22px}
  .section h2{margin-bottom:12px;padding-bottom:8px;font-size:1.25rem}
}
@page{size:A4 portrait;margin:15mm}
@media print{
  html,body{background:#fff!important}
  .screen-bar{display:none!important}
  .paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;overflow:visible!important}
  .chord-viewport{overflow:visible!important;padding:0!important}
  .section pre{white-space:pre!important;overflow:visible!important;max-width:none!important}
  .empty{display:none}
}
</style>
</head>
<body>
<div class="screen-bar">
  <button class="back" type="button" id="backBtn">← 元のノートへ戻る</button>
  <div class="screen-actions">
    <button class="print" type="button" id="printBtn">🖨 印刷する</button>
    <button class="pdf" type="button" id="pdfBtn">📄 PDFにする</button>
  </div>
</div>
<main id="paper" class="paper" hidden>
  <h1 id="title"></h1>
  <div id="credits" class="meta"></div>
  <div id="songMeta" class="meta"></div>
  <section class="section"><h2>コード進行メモ</h2><div class="chord-viewport" id="chordViewport"><pre id="chords"></pre></div></section>
</main>
<div id="empty" class="empty" hidden>印刷するノートが見つかりませんでした。ノート画面からもう一度「ノート内容を印刷」を押してください。</div>
<script>
(()=>{
'use strict';
const ROOT='https://akito0802.github.io/NEET-note/';
const PRINT_KEY='neet-note-print-current-v1';
const SONGS_KEY='song-note-songs-v1';
const add=(el,label,value)=>{if(!value)return;const span=document.createElement('span');span.textContent=`${label}: ${value}`;el.appendChild(span)};
let data=null;try{data=JSON.parse(localStorage.getItem(PRINT_KEY)||'null')}catch{}
const paper=document.getElementById('paper'),empty=document.getElementById('empty'),chords=document.getElementById('chords');
const pdfBtn=document.getElementById('pdfBtn');

function applyChordLayout(layout){
  if(!layout||typeof layout!=='object')return;
  const allowed=['fontFamily','fontSize','fontWeight','fontStyle','lineHeight','letterSpacing','wordSpacing','fontVariantLigatures'];
  allowed.forEach(key=>{if(typeof layout[key]==='string'&&layout[key])chords.style[key]=layout[key]});
  if(typeof layout.tabSize==='string'&&layout.tabSize)chords.style.tabSize=layout.tabSize;
  if(Number.isFinite(layout.editorWidth)&&layout.editorWidth>0)chords.style.minWidth=`${Math.round(layout.editorWidth)}px`;
  chords.style.whiteSpace='pre';
  chords.style.overflowWrap='normal';
  chords.style.wordBreak='normal';
  chords.style.fontVariantLigatures='none';
}

function legacyMatchedSongUrl(snapshot){
  let songs=[];
  try{
    const parsed=JSON.parse(localStorage.getItem(SONGS_KEY)||'[]');
    if(Array.isArray(parsed))songs=parsed;
  }catch{}
  if(!songs.length||!snapshot)return '';
  const ranked=songs.map(song=>{
    let score=0;
    if(snapshot.title&&snapshot.title!=='無題の曲'&&song.title===snapshot.title)score+=8;
    if(snapshot.chords&&snapshot.chords!=='未入力'&&song.chords===snapshot.chords)score+=10;
    if(snapshot.artist&&song.artist===snapshot.artist)score+=2;
    if(snapshot.lyricist&&song.lyricist===snapshot.lyricist)score+=2;
    if(snapshot.composer&&song.composer===snapshot.composer)score+=2;
    if(snapshot.date&&song.productionDate===snapshot.date)score+=1;
    return {song,score};
  }).filter(item=>item.song?.id).sort((a,b)=>b.score-a.score);
  const best=ranked[0],second=ranked[1];
  if(best&&best.score>=6&&(!second||best.score>second.score))return ROOT+'?song='+encodeURIComponent(best.song.id);
  return '';
}

function resolveReturnUrl(){
  if(data&&typeof data.returnUrl==='string'&&data.returnUrl.startsWith(ROOT))return data.returnUrl;
  if(data&&data.songId)return ROOT+'?song='+encodeURIComponent(data.songId);
  const legacy=legacyMatchedSongUrl(data);
  if(legacy)return legacy;
  return ROOT+'?mode=note';
}

function safeFileName(name){
  return String(name||'NEET_NOTE').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().slice(0,80)||'NEET_NOTE';
}

function loadScript(src,test){
  if(test())return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const existing=[...document.scripts].find(script=>script.src===src);
    if(existing){
      if(test())resolve();
      else{existing.addEventListener('load',()=>test()?resolve():reject(new Error('library unavailable')),{once:true});existing.addEventListener('error',reject,{once:true});}
      return;
    }
    const script=document.createElement('script');
    script.src=src;
    script.async=true;
    script.onload=()=>test()?resolve():reject(new Error('library unavailable'));
    script.onerror=()=>reject(new Error('library load failed'));
    document.head.appendChild(script);
  });
}

async function ensurePdfLibraries(){
  await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',()=>typeof window.html2canvas==='function');
  await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',()=>Boolean(window.jspdf?.jsPDF));
}

async function exportPdf(){
  if(!data||paper.hidden)return;
  const oldText=pdfBtn.textContent;
  pdfBtn.disabled=true;
  pdfBtn.textContent='PDF作成中…';
  try{
    await ensurePdfLibraries();
    document.body.classList.add('pdf-exporting');
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const captureWidth=Math.max(paper.scrollWidth,paper.offsetWidth);
    const captureHeight=Math.max(paper.scrollHeight,paper.offsetHeight);
    const canvas=await window.html2canvas(paper,{
      scale:Math.min(2.4,Math.max(2,window.devicePixelRatio||2)),
      backgroundColor:'#ffffff',
      useCORS:true,
      logging:false,
      width:captureWidth,
      height:captureHeight,
      windowWidth:captureWidth,
      windowHeight:captureHeight,
      scrollX:0,
      scrollY:0
    });
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const margin=10;
    const pageWidth=210;
    const pageHeight=297;
    const contentWidth=pageWidth-margin*2;
    const contentHeight=pageHeight-margin*2;
    const sliceHeightPx=Math.max(1,Math.floor(canvas.width*(contentHeight/contentWidth)));
    let y=0,pageIndex=0;
    while(y<canvas.height){
      const h=Math.min(sliceHeightPx,canvas.height-y);
      const slice=document.createElement('canvas');
      slice.width=canvas.width;
      slice.height=h;
      const ctx=slice.getContext('2d',{alpha:false});
      ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
      ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(pageIndex>0)pdf.addPage('a4','portrait');
      const renderedHeight=(h/canvas.width)*contentWidth;
      pdf.addImage(slice.toDataURL('image/jpeg',0.94),'JPEG',margin,margin,contentWidth,renderedHeight,undefined,'FAST');
      y+=h;
      pageIndex+=1;
    }
    const filename=safeFileName(data.title||'無題の曲')+'_ノート.pdf';
    const blob=pdf.output('blob');
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(error){
    console.error('[NEET NOTE] PDF export failed',error);
    alert('PDFを作成できませんでした。通信状態を確認してもう一度試してください。');
  }finally{
    document.body.classList.remove('pdf-exporting');
    pdfBtn.disabled=false;
    pdfBtn.textContent=oldText;
  }
}

if(data&&typeof data==='object'){
  document.getElementById('title').textContent=data.title||'無題の曲';
  const credits=document.getElementById('credits');
  add(credits,'アーティスト',data.artist);add(credits,'作詞',data.lyricist);add(credits,'作曲',data.composer);add(credits,'編曲',data.arranger);add(credits,'制作日',data.date);
  const meta=document.getElementById('songMeta');
  add(meta,'Key',data.key||'未設定');add(meta,'BPM',data.bpm||'未設定');add(meta,'拍子',data.time||'未設定');
  chords.textContent=typeof data.chords==='string'&&data.chords.length?data.chords:'未入力';
  applyChordLayout(data.chordLayout);
  paper.hidden=false;
}else{
  empty.hidden=false;
  pdfBtn.disabled=true;
}

document.getElementById('backBtn').addEventListener('click',()=>location.assign(resolveReturnUrl()));
document.getElementById('printBtn').addEventListener('click',()=>window.print());
pdfBtn.addEventListener('click',exportPdf);
})();
</script>



<script src="https://akito0802.github.io/NEET-note/global-menu-v4.js?v=20260821-safe6"></script>
</body>
</html>
