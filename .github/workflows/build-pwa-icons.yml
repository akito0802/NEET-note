name: Build PWA icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - icon-chunks/part1.txt
      - .github/workflows/build-pwa-icons.yml

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode source icon
        run: |
          base64 --decode icon-chunks/part1.txt > icon-source.png

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate PWA icon sizes
        run: |
          convert icon-source.png -resize 512x512 icon-512.png
          convert icon-source.png -resize 192x192 icon-192.png
          convert icon-source.png -resize 180x180 apple-touch-icon.png
          convert icon-source.png -resize 32x32 favicon-32x32.png
          convert icon-source.png -resize 16x16 favicon-16x16.png

      - name: Update manifest icon references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('manifest.webmanifest')
          data = json.loads(path.read_text())
          data['icons'] = [
            {'src':'icon-192.png?v=9','sizes':'192x192','type':'image/png','purpose':'any maskable'},
            {'src':'icon-512.png?v=9','sizes':'512x512','type':'image/png','purpose':'any maskable'},
            {'src':'apple-touch-icon.png?v=9','sizes':'180x180','type':'image/png','purpose':'any'}
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('service-worker.js')
          text = path.read_text()
          text = re.sub(r"const CACHE='[^']+';", "const CACHE='neet-note-pwa-v9';", text, count=1)
          for name in ['icon-192.png','icon-512.png','favicon-32x32.png','favicon-16x16.png']:
            entry = f"'./{name}'"
            if entry not in text:
              text = text.replace("'./apple-touch-icon.png'", f"'./apple-touch-icon.png',{entry}")
          path.write_text(text)
          PY

      - name: Commit generated icons
        run: |
          rm -f icon-source.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-512.png icon-192.png apple-touch-icon.png favicon-32x32.png favicon-16x16.png manifest.webmanifest service-worker.js
          git diff --cached --quiet || git commit -m "新しいPWAアイコンを反映"
          git push
