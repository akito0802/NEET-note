name: Apply sync refresh fix

on:
  push:
    paths:
      - '.github/workflows/apply-sync-loader-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cloud-sync.js')
          s = p.read_text(encoding='utf-8')
          old = "if(changed&&!sessionStorage.getItem('neet-sync-reloaded')){sessionStorage.setItem('neet-sync-reloaded','1');location.reload()}"
          new = "if(changed){window.dispatchEvent(new CustomEvent('neet-note:cloud-synced'));location.reload()}"
          if old not in s:
              raise SystemExit('cloud refresh condition not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('common-ui.js')
          s = p.read_text(encoding='utf-8').replace("load('firebase-config.js','20260805').then(()=>load('cloud-sync.js','20260805'))", "load('firebase-config.js','20260805b').then(()=>load('cloud-sync.js','20260805b'))")
          p.write_text(s, encoding='utf-8')

          for name in ('lyrics.html','calendar.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8').replace('common-ui.js?v=20260805', 'common-ui.js?v=20260805b')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-sync.js common-ui.js lyrics.html calendar.html
          git commit -m "同期後に各ページを確実に更新"
          git push

# trigger: refresh-fix
