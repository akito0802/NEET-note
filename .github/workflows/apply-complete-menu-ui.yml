name: Apply complete menu UI

on:
  push:
    paths:
      - '.github/workflows/apply-complete-menu-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared menu UI into every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'menu-ui.js' in s:
                  continue
              tag='<script src="menu-ui.js?v=20260805-1"></script>'
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('updated:', ', '.join(changed))
          if not changed:
              print('No HTML files needed changes')
          PY
      - name: Commit unified menu
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "全ページのハンバーガーメニューを完成版UIに統一"
          git push
