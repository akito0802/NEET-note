name: Bump menu UI cache

on:
  push:
    paths:
      - '.github/workflows/bump-menu-ui-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump menu-ui version in every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              n = re.sub(r'menu-ui\.js\?v=[^"\']+', 'menu-ui.js?v=20260805-3', s)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))
          print('updated:', ', '.join(changed))
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "完成版メニューのキャッシュを更新"
          git push
