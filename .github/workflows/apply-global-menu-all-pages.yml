name: Apply global menu to all pages
on:
  push:
    branches: [main]
    paths:
      - 'global-menu-v4.js'
      - 'global-menu.js'
      - 'global-menu-compact-width.js'
      - 'global-menu-left-top.js'
      - 'global-menu-safe-area.js'
      - 'menu-dedupe.js'
      - 'home-route-fix.js'
      - 'home.html'
      - 'note-workspace.js'
      - '.github/workflows/apply-global-menu-all-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardwire dedicated home targets
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('global-menu.js')
          if g.exists():
              s=g.read_text(encoding='utf-8')
              old=s
              marker="topReturn.classList.add('ngm-top-return','neet-top-return');"
              if marker in s and "topReturn.href=ROOT+'home.html';" not in s:
                  s=s.replace(marker,"topReturn.href=ROOT+'home.html';\n"+marker,1)
              if s!=old:g.write_text(s,encoding='utf-8')
          n=Path('note-workspace.js')
          if n.exists():
              s=n.read_text(encoding='utf-8')
              s2=s.replace('https://akito0802.github.io/NEET-note/?home=current','https://akito0802.github.io/NEET-note/home.html')
              if s2!=s:n.write_text(s2,encoding='utf-8')
          PY
      - name: Replace old shared menu loader on every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          tag='<script src="https://akito0802.github.io/NEET-note/global-menu-v4.js?v=20260817-4"></script>'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              original=s
              s=re.sub(r'<script[^>]+src=["\']https://akito0802\.github\.io/NEET-note/global-menu(?:-v4)?\.js\?v=[^"\']+["\'][^>]*></script>','',s)
              s=re.sub(r'<script[^>]+src=["\']https://akito0802\.github\.io/NEET-note/menu-dedupe\.js\?v=[^"\']+["\'][^>]*></script>','',s)
              s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+'\n'+tag+'\n'
              if s!=original:
                  p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('Updated',len(changed),'files')
          for x in changed: print(x)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hardwire all home actions to dedicated NEETNOTE home"
          git pull --rebase origin main
          git push
