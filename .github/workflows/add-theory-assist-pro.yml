name: Add enhanced theory assist

on:
  push:
    paths:
      - '.github/workflows/add-theory-assist-pro.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create theory assist and connect navigation
        run: |
          cat > theory-assist.html <<'HTML'
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9c7a8"><title>理論アシスト | NEET NOTE</title><link rel="icon" href="favicon.svg?v=2"><link rel="stylesheet" href="common-ui.css?v=1">
          <style>
          :root{--paper:#fffdf8;--ink:#1f2937;--muted:#71695f;--line:#ded6c9;--accent:#8b6f47;--soft:#f4eee4;--good:#2f7d5a;--warn:#a15c24}*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}.wrap{max-width:1040px;margin:auto;padding:16px 16px 90px}.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.menu-button{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:1.3rem}.eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.14em;color:var(--muted)}h1{margin:2px 0 0;font-size:1.55rem}.lead{margin:0 0 16px;color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.card{background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 26px rgba(80,60,30,.06)}h2{font-size:1.05rem;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;margin-bottom:5px;font-size:.8rem;font-weight:800;color:var(--muted)}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;color:inherit}textarea{min-height:84px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:11px;padding:10px 13px;background:var(--accent);color:white;font-weight:850;cursor:pointer}.sub{background:#eee7dc;color:#392f23}.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.summary{padding:13px;border-radius:14px;background:var(--soft);line-height:1.65}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:white;font-size:.8rem;font-weight:800}.candidate{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ece5da}.candidate:last-child{border:0}.rank{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#eadfce;font-weight:900}.chord{font-size:1.12rem;font-weight:950}.why{font-size:.78rem;color:var(--muted);line-height:1.45}.score{font-size:.78rem;font-weight:900;color:var(--good)}.tone-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.tone{padding:9px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;background:white;font-size:.78rem}.tone.avoid{background:#fff1e8;color:var(--warn);border-color:#e8b995}.tone.strong{background:#eaf6ef;color:var(--good);border-color:#abd2bc}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:48px;padding:9px;border:1px dashed #cdbfae;border-radius:13px}.prog{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:10px;background:#ede4d6;font-weight:850}.prog button{padding:0;background:none;color:#76634c}.section{margin-top:14px}.notice{font-size:.78rem;color:var(--muted);line-height:1.55}.wide{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.tone-grid{grid-template-columns:repeat(4,1fr)}}
          </style></head><body><main class="wrap"><header class="top"><button id="menuOpenBtn" class="menu-button" aria-label="メニューを開く">☰</button><div><div class="eyebrow">NEET NOTE THEORY ASSIST</div><h1>理論アシスト Pro</h1></div></header><p class="lead">キー・直前コード・メロディ音をまとめて見て、次コード、使えるスケール、注意音、借用和音まで提案するよ。</p>
          <div class="grid"><section class="card"><h2>曲の状況</h2><div class="row"><div class="field"><label>キー</label><select id="key"></select></div><div class="field"><label>モード</label><select id="mode"><option value="major">メジャー</option><option value="minor">ナチュラルマイナー</option></select></div></div><div class="field"><label>直前のコード</label><input id="prev" value="G" placeholder="例 G / Am7 / F#dim"></div><div class="field"><label>今鳴っているメロディ音</label><input id="melody" value="B D" placeholder="例 C E G / F# A"></div><div class="field"><label>欲しい雰囲気</label><select id="mood"><option value="natural">自然につなぐ</option><option value="bright">明るく開く</option><option value="emotional">切なくする</option><option value="tense">緊張感を作る</option><option value="jazz">おしゃれにする</option></select></div><div class="buttons"><button id="analyze">分析する</button><button id="reset" class="sub">リセット</button></div><p class="notice">候補は絶対の正解じゃなく、作曲の選択肢。耳で気持ちいいものを選んでね。</p></section>
          <section class="card"><h2>分析結果</h2><div id="summary" class="summary"></div><div class="section"><h2>次コード候補</h2><div id="candidates"></div></div></section>
          <section class="card"><h2>使えるスケール</h2><div id="scales" class="chips"></div><div class="section"><h2>メロディ音の役割</h2><div id="tones" class="tone-grid"></div></section></section>
          <section class="card"><h2>色を変えるコード</h2><div id="colors"></div></section>
          <section class="card wide"><h2>進行ビルダー</h2><div id="progression" class="progression"></div><div class="buttons"><button id="play">▶ 鳴らす</button><button id="copy" class="sub">コピー</button><button id="clear" class="ghost">空にする</button></div></section></div></main><script src="common-ui.js?v=4"></script><script src="menu-ui.js?v=20260805-5"></script>
          <script>
          (()=>{'use strict';const $=id=>document.getElementById(id),N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],flat={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'},idx=n=>N.indexOf(flat[n]||n),steps={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]},qualities={major:['','m','m','','','m','dim'],minor:['m','dim','','m','m','','']},roman={major:['I','ii','iii','IV','V','vi','vii°'],minor:['i','ii°','III','iv','v','VI','VII']},functions={major:['主役・安定','柔らかい前進','浮遊感','広がり','強い帰結','切なさ','強い緊張'],minor:['主役・暗い安定','緊張','明るい抜け','哀愁','前進','温かい広がり','力強い展開']};let prog=[],$key=$('key'),$mode=$('mode');$key.innerHTML=N.map(n=>`<option>${n}</option>`).join('');function rootChord(d){return N[(idx($key.value)+steps[$mode.value][d]+12)%12]+qualities[$mode.value][d]}function parseRoot(c){return (c.match(/^[A-G](?:#|b)?/)||[''])[0]}function chordNotes(c){const r=idx(parseRoot(c));if(r<0)return[];const minor=/m(?!aj)/.test(c),dim=/dim|°/.test(c),sev=/7/.test(c);let ints=dim?[0,3,6]:minor?[0,3,7]:[0,4,7];if(sev)ints.push(/maj7/.test(c)?11:10);return ints.map(x=>N[(r+x)%12])}function melodyNotes(){return $('melody').value.split(/[\s,、/]+/).map(x=>flat[x]||x).filter(x=>N.includes(x))}function scoreChord(c,d){const notes=chordNotes(c),mel=melodyNotes(),prev=parseRoot($('prev').value),r=parseRoot(c);let s=55,why=[];const hits=mel.filter(n=>notes.includes(n)).length;s+=hits*12;if(hits)why.push(`メロディ${hits}音をコードトーンに含む`);const movement=(idx(r)-idx(prev)+12)%12;if([5,7].includes(movement)){s+=8;why.push('根音の流れが自然')}const mood=$('mood').value;if(mood==='bright'&&[0,3,4].includes(d))s+=8;if(mood==='emotional'&&[1,5].includes(d))s+=9;if(mood==='tense'&&[4,6].includes(d))s+=10;if(mood==='jazz')s+=d===1||d===4?10:3;if(d===0){s+=7;why.push('主和音へ着地')}if(d===4){s+=7;why.push('次の展開を強く作る')}return{c,d,s:Math.min(98,s),why:why.length?why.join('・'):functions[$mode.value][d]}}function analyze(){const mode=$mode.value,scale=steps[mode].map(x=>N[(idx($key.value)+x)%12]),mel=melodyNotes(),all=[0,1,2,3,4,5,6].map(d=>scoreChord(rootChord(d),d)).sort((a,b)=>b.s-a.s);$('summary').innerHTML=`<b>${$key.value} ${mode==='major'?'メジャー':'マイナー'}</b>として分析中。直前コードは <b>${$('prev').value||'未指定'}</b>、メロディは <b>${mel.join('・')||'未指定'}</b>。<div class="chips">${scale.map(n=>`<span class="chip">${n}</span>`).join('')}</div>`;$('candidates').innerHTML=all.slice(0,5).map((x,i)=>`<div class="candidate"><span class="rank">${i+1}</span><div><div class="chord">${x.c} <small>${roman[mode][x.d]}</small></div><div class="why">${x.why}</div></div><div><div class="score">適合 ${x.s}%</div><button data-add="${x.c}" class="sub">追加</button></div></div>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{prog.push(b.dataset.add);renderProg()});$('scales').innerHTML=[`${$key.value} ${mode==='major'?'メジャー':'ナチュラルマイナー'}`,mode==='major'?`${$key.value} メジャーペンタ`:`${$key.value} マイナーペンタ`,mode==='major'?`${N[(idx($key.value)+7)%12]} ミクソリディアン`:`${N[(idx($key.value)+5)%12]} ドリアン`].map(x=>`<span class="chip">${x}</span>`).join('');$('tones').innerHTML=scale.map((n,i)=>{const strong=mel.includes(n),avoid=mode==='major'&&i===3;return`<div class="tone ${strong?'strong':''} ${avoid?'avoid':''}"><b>${n}</b><br>${strong?'使用中':avoid?'伸ばし注意':i===0?'主音':i===2?'コード感':i===4?'安定':'経過音'}</div>`}).join('');const borrowed=mode==='major'?[`${N[(idx($key.value)+5)%12]}m`,`bVII: ${N[(idx($key.value)+10)%12]}`,`${N[(idx($key.value)+8)%12]}`]:[`${N[(idx($key.value)+5)%12]}`,`V: ${N[(idx($key.value)+7)%12]}`,`${N[(idx($key.value)+1)%12]}`];$('colors').innerHTML=borrowed.map((c,i)=>`<div class="candidate"><span class="rank">＋</span><div><div class="chord">${c}</div><div class="why">${['同主調から借りて切なさを追加','強い展開や帰結を作る','一瞬だけ景色を変える'][i]}</div></div></div>`).join('');localStorage.setItem('neet-theory-settings',JSON.stringify({key:$key.value,mode,prev:$('prev').value,melody:$('melody').value,mood:$('mood').value}))}function renderProg(){$('progression').innerHTML=prog.map((c,i)=>`<span class="prog">${c}<button data-rm="${i}">×</button></span>`).join('')||'<span class="notice">候補の「追加」で進行を作れるよ</span>';document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{prog.splice(+b.dataset.rm,1);renderProg()})}let ac;function playChord(c,t){ac=ac||new(window.AudioContext||window.webkitAudioContext)();const notes=chordNotes(c),base=48;notes.forEach((n,i)=>{const o=ac.createOscillator(),g=ac.createGain(),m=base+((idx(n)-idx('C')+12)%12)+12*(i>1);o.type='sine';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.75);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.8)})}$('play').onclick=()=>{if(!prog.length)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();prog.forEach((c,i)=>playChord(c,ac.currentTime+i*.85))};$('copy').onclick=async()=>{await navigator.clipboard.writeText(prog.join(' - '));$('copy').textContent='コピー済み';setTimeout(()=>$('copy').textContent='コピー',900)};$('clear').onclick=()=>{prog=[];renderProg()};$('analyze').onclick=analyze;$('reset').onclick=()=>{$key.value='C';$mode.value='major';$('prev').value='G';$('melody').value='B D';$('mood').value='natural';analyze()};try{const s=JSON.parse(localStorage.getItem('neet-theory-settings'));if(s){$key.value=s.key||'C';$mode.value=s.mode||'major';$('prev').value=s.prev||'';$('melody').value=s.melody||'';$('mood').value=s.mood||'natural'}}catch{}analyze();renderProg()})();
          </script></body></html>
          HTML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('menu-ui.js'); s=p.read_text(encoding='utf-8')
          marker=" ['melody.html','🎹','メロディ入力',page==='melody.html'],"
          add=marker+"\n ['theory-assist.html','🧠','理論アシスト',page==='theory-assist.html'],"
          if 'theory-assist.html' not in s and marker in s:s=s.replace(marker,add,1)
          s=s.replace('コード・スケール・指板へ、同じメニューから移動できるよ。','コード・スケール・指板・理論アシストへ、同じメニューから移動できるよ。')
          p.write_text(s,encoding='utf-8')
          p=Path('tools.html'); s=p.read_text(encoding='utf-8')
          marker='<section class="card wide"><h2>🗂 楽曲管理・バックアップ</h2>'
          card='<section class="card wide"><h2>🧠 理論アシスト Pro</h2><p>キー・直前コード・メロディ音から、次コード、スケール、注意音、借用和音を提案するよ。</p><div class="row"><a class="btn" href="theory-assist.html">理論アシストを開く</a></div></section>\n'
          if 'href="theory-assist.html"' not in s and marker in s:s=s.replace(marker,card+marker,1)
          p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("neet-note-pwa-v19","neet-note-pwa-v20")
          if "'./theory-assist.html'" not in s:s=s.replace("'./tools.html'","'./tools.html','./theory-assist.html'",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theory-assist.html menu-ui.js tools.html service-worker.js
          git commit -m "理論アシストProを実装"
          git push
