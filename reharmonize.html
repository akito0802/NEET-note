<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3eadc"><title>代理コード・リハーモナイズ辞典 | NEETNOTE</title><link rel="icon" type="image/svg+xml" href="favicon.svg?v=1"><link rel="stylesheet" href="theory-tools.css?v=20260819-1"></head><body>
<main class="tt-page"><section class="tt-hero"><p class="tt-eyebrow">CHORD / REHARMONIZE</p><h1>代理コード・リハーモナイズ辞典</h1><p>選んだコードに対して、役割を保ちやすい代理コードから色の強い置換までをカテゴリ別に表示します。「なぜ置き換えられるか」も一緒に確認できます。</p></section><div class="tt-layout"><section class="tt-panel"><div class="tt-field"><label>キー</label><select id="key" class="tt-select"></select></div><div class="tt-field" style="margin-top:10px"><label>対象コード</label><input id="chord" class="tt-input" value="C" placeholder="例: C, Am7, G7"></div><div class="tt-field" style="margin-top:10px"><label>ダイアトニックから選択</label><select id="diatonic" class="tt-select"></select></div><button id="analyze" class="tt-btn primary" style="width:100%;margin-top:12px">代理候補を表示</button><div id="baseInfo" class="tt-status" style="margin-top:12px"></div><div class="tt-audio"><button id="playBase" class="tt-btn">元コードを鳴らす</button></div></section><section class="tt-panel"><div class="tt-section-title"><h2>置換候補</h2><span>SAFE → COLOR</span></div><div id="results" class="tt-list"></div></section></div></main>
<script src="theory-tools-core.js?v=20260819-1"></script><script>
(()=>{const T=NEETTheory,$=id=>document.getElementById(id);let base=null;T.populateKeySelect($('key'));$('key').value='C';function refreshDiatonic(){const k=T.keyFromId($('key').value),chs=T.diatonicChords(k,true);$('diatonic').innerHTML='<option value="">選択してください</option>'+chs.map(c=>`<option value="${c.label}">${c.roman} ${c.label}</option>`).join('')}function shared(a,b){const A=new Set(a.pcs),n=b.pcs.filter(x=>A.has(x)).length;return Math.round(n/Math.max(a.pcs.length,b.pcs.length)*100)}function relChord(ch){const prefer=T.preferFlats(ch.root)?'flat':'sharp';if(ch.name.includes('minor'))return T.chordLabel(T.noteName(ch.rootPc+3,prefer),'');return T.chordLabel(T.noteName(ch.rootPc+9,prefer),'m')}function item(label,code,why,level){const c=T.parseChord(code),pct=c&&base?shared(base,c):0;return `<div class="tt-list-item"><div class="tt-result-title"><b>${label}</b><span class="tt-chip ${level==='安全'?'good':level==='色付け'?'strong':'warn'}">${level}</span></div><strong class="tt-code" style="display:block;margin-top:6px;font-size:1rem">${code}</strong><p>${why}${c?` / 構成音共有率 ${pct}%`:''}</p><button class="tt-btn audition" data-chord="${code}" style="margin-top:8px">比較試聴</button></div>`}
function analyze(){const k=T.keyFromId($('key').value);base=T.parseChord($('chord').value);if(!base){$('baseInfo').textContent='コード名を読み取れません。';$('results').innerHTML='';return}const dia=T.diatonicChords(k,false),match=dia.find(x=>T.sameChord(x.chord,base));$('baseInfo').textContent=match?`${base.raw} は ${T.keyLabel(k)} の ${match.roman}。機能は ${match.function==='T'?'Tonic':match.function==='PD'?'Pre-Dominant':'Dominant'}。同じ機能のコードは比較的安全に置き換えやすいです。`:`${base.raw} はこのキーの三和音ダイアトニック外。固定ルールによる色付け候補を中心に表示します。`;const out=[];if(match){dia.filter(x=>x.function===match.function&&!T.sameChord(x.chord,base)).forEach(x=>out.push(item(`同機能 ${x.roman}`,x.label,`${match.function}機能を保ったダイアトニック代理。`,'安全')))}const rel=relChord(base);if(rel!==base.raw)out.push(item('相対関係',rel,'ルートを長3度/短3度ずらし、構成音を共有しやすい相対長短関係。','安全'));const sec=T.secondaryDominantFor(base);out.push(item('セカンダリードミナント',sec,`${base.root} を一時的な主音とみなし、そのV7を直前に置く方法。置換より「差し込み」に向きます。`,'色付け'));if(base.name==='dominant7'){const tri=T.tritoneSub(base);if(tri)out.push(item('トライトーン代理',tri,'ドミナント7thの3度と7度を共有する代表的な代理。ベースが半音進行になりやすいです。','大胆'))}const prefer=T.preferFlats(base.root)?'flat':'sharp',dimRoot=T.noteName(base.rootPc-1,prefer);out.push(item('半音下からのdim7',T.chordLabel(dimRoot,'dim7'),`${base.root} へ半音上行する導音ディミニッシュとして使う候補。`,'色付け'));$('results').innerHTML=out.join('');document.querySelectorAll('.audition').forEach(b=>b.onclick=()=>{T.playChord(base,0);T.playChord(T.parseChord(b.dataset.chord),.78)})}
$('key').onchange=()=>{refreshDiatonic();analyze()};$('diatonic').onchange=()=>{if($('diatonic').value){$('chord').value=$('diatonic').value;analyze()}};$('analyze').onclick=analyze;$('playBase').onclick=()=>base&&T.playChord(base);refreshDiatonic();analyze()})();
</script>
