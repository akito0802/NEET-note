<!DOCTYPE html>

<style>
:root{--cal:#a97845;--soft:#f2e7d8;--line:rgba(0,0,0,.1)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--text,#27231f);background:var(--bg,#eee7dc);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.shell{width:min(1160px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:clamp(1.45rem,5vw,2.2rem)}.eyebrow{margin:0;color:var(--muted,#756f67);font-size:.68rem;font-weight:900;letter-spacing:.16em}.icon-btn,.pill,.primary,.ghost{border:1px solid var(--border,var(--line));background:var(--paper,#fffdf8);color:inherit;font:inherit;font-weight:800;cursor:pointer}.icon-btn{width:42px;height:42px;border-radius:12px}.pill{padding:9px 14px;border-radius:999px}.primary{padding:12px 16px;border:0;border-radius:13px;background:var(--cal);color:#fff}.ghost{padding:10px 13px;border-radius:12px;background:transparent}.card{padding:clamp(14px,3vw,22px);border:1px solid var(--border,var(--line));border-radius:22px;background:var(--paper,#fffdf8);box-shadow:var(--shadow,0 10px 30px rgba(0,0,0,.06))}.toolbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.toolbar h2{margin:0;text-align:center}.subtools,.filters,.export{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.weekday,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday span{text-align:center;color:var(--muted,#756f67);font-size:.72rem;font-weight:900}.day{min-height:88px;padding:8px;border:1px solid var(--border,var(--line));border-radius:13px;background:var(--paper,#fffdf8);color:inherit;text-align:left;cursor:pointer}.day.other{opacity:.35}.day.today{outline:2px solid var(--cal);outline-offset:-2px}.day.selected{background:var(--soft)}[data-theme="dark"] .day.selected{background:rgba(169,120,69,.22)}.day-num{font-weight:900}.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}.dot{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:rgba(169,120,69,.14);font-size:.72rem}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px;margin-top:16px}.panel h2{margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px;border-radius:14px;background:var(--soft)}[data-theme="dark"] .stat{background:rgba(169,120,69,.18)}.stat strong{display:block;font-size:1.35rem}.stat span{color:var(--muted,#756f67);font-size:.74rem;font-weight:800}.activity{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--border,var(--line));border-radius:14px;margin-bottom:8px}.activity small{color:var(--muted,#756f67)}.empty{text-align:center;color:var(--muted,#756f67);padding:24px}.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;overflow:auto;padding:8px 0}.heat{border-radius:3px;background:rgba(127,127,127,.12)}.heat[data-l="1"]{background:rgba(169,120,69,.28)}.heat[data-l="2"]{background:rgba(169,120,69,.48)}.heat[data-l="3"]{background:rgba(169,120,69,.7)}.heat[data-l="4"]{background:rgba(169,120,69,.95)}.timeline{max-height:330px;overflow:auto}.timeline-row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--border,var(--line));font-size:.88rem}dialog{width:min(94vw,500px);padding:0;border:0;border-radius:22px;background:var(--paper,#fffdf8);color:inherit}dialog::backdrop{background:rgba(0,0,0,.45)}.dialog{padding:20px}.field{display:grid;gap:6px;margin-bottom:13px}.field span{font-size:.78rem;font-weight:900}.field select,.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--border,var(--line));border-radius:11px;background:var(--paper,#fffdf8);color:inherit;font:inherit}.time-wheel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.wheel{height:112px;overflow-y:auto;scroll-snap-type:y mandatory;border:1px solid var(--border,var(--line));border-radius:13px;padding:36px 0}.wheel button{display:block;width:100%;height:40px;border:0;background:transparent;color:inherit;font:inherit;font-weight:900;scroll-snap-align:center}.quick{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px}.quick button{flex:1;min-width:82px;padding:9px;border:1px solid var(--border,var(--line));border-radius:999px;background:transparent;color:inherit;font-weight:800}.time-display{text-align:center;font-size:1.2rem;font-weight:900;margin:8px}.actions{display:flex;justify-content:flex-end;gap:8px}.menu-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);opacity:0;visibility:hidden}.menu-overlay.open{opacity:1;visibility:visible}.menu{position:fixed;inset:0 auto 0 0;z-index:21;width:min(82vw,300px);padding:22px 16px;background:var(--paper,#fffdf8);transform:translateX(-105%);transition:.2s}.menu.open{transform:none}.menu a,.menu button{display:flex;width:100%;gap:10px;padding:13px;border:0;border-radius:12px;background:transparent;color:inherit;text-decoration:none;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}.day{min-height:66px;padding:6px}.dot{width:18px;height:18px}.shell{width:min(100% - 14px,760px)}.card{border-radius:18px}.top{align-items:flex-start}.timeline-row{grid-template-columns:66px 1fr auto}}@media print{.top,.subtools,.filters,.export,#addActivity,.menu,.menu-overlay,dialog{display:none!important}.shell{width:100%;padding:0}.card{box-shadow:none}.grid{grid-template-columns:1fr}.day{min-height:60px}}
</style></head>
<body>
<div id="overlay" class="menu-overlay"></div><nav id="menu" class="menu"><button id="closeMenu">× 閉じる</button><a href="./?mode=note">📝 ノート</a><a href="calendar.html">📅 制作カレンダー</a><button data-theme-toggle>🌙 テーマ切替</button></nav>
<main class="shell"><header class="top"><div class="brand"><button id="openMenu" class="icon-btn">☰</button><div><p class="eyebrow">CREATION LOG</p><h1>制作カレンダー</h1></div></div><button id="addActivity" class="primary">＋ 制作記録</button></header>
<section class="card"><div class="toolbar"><button id="prev" class="icon-btn">‹</button><h2 id="monthTitle"></h2><button id="next" class="icon-btn">›</button></div><div class="subtools"><button id="today" class="pill">今日へ</button></div><div class="filters"><select id="songFilter" class="pill"><option value="">すべての曲</option></select><select id="typeFilter" class="pill"><option value="">すべての内容</option><option value="note">ノート</option><option value="lyrics">歌詞</option><option value="voice">録音</option><option value="idea">アイデア</option><option value="practice">練習</option><option value="mix">ミックス</option></select></div><div class="weekday"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="days" class="days"></div></section>
<section class="grid"><article class="card panel"><h2 id="selectedTitle"></h2><div id="activities"></div><h2 style="margin-top:22px">日別タイムライン</h2><div id="timeline" class="timeline"></div></article><aside class="card panel"><h2>月間統計</h2><div class="stats"><div class="stat"><strong id="statDays">0</strong><span>制作日数</span></div><div class="stat"><strong id="statCount">0</strong><span>記録件数</span></div><div class="stat"><strong id="statTime">0分</strong><span>制作時間</span></div><div class="stat"><strong id="statStreak">0日</strong><span>連続制作</span></div></div><h2 style="margin-top:20px">年間統計</h2><div class="stats"><div class="stat"><strong id="yearDays">0</strong><span>制作日数</span></div><div class="stat"><strong id="yearTime">0分</strong><span>制作時間</span></div></div><h2 style="margin-top:20px">制作ヒートマップ</h2><div id="heatmap" class="heatmap"></div><div class="export"><button id="csv" class="ghost">CSV</button><button id="pdf" class="ghost">PDF / 印刷</button></div></aside></section></main>
<dialog id="dialog"><form id="form" class="dialog"><h2>制作記録を追加</h2><label class="field"><span>制作内容</span><select id="activityType"><option value="note">📝 ノート</option><option value="lyrics">🎤 歌詞</option><option value="voice">🎙 録音</option><option value="idea">💡 アイデア</option><option value="practice">🎸 練習</option><option value="mix">🎧 ミックス</option></select></label><label class="field"><span>曲</span><select id="activitySong"><option value="">曲を指定しない</option></select></label><span style="font-size:.78rem;font-weight:900">制作時間</span><div class="time-wheel"><div id="hourWheel" class="wheel"></div><b>:</b><div id="minuteWheel" class="wheel"></div></div><div id="timeDisplay" class="time-display">0時間 30分</div><div class="quick"><button type="button" data-add="15">＋15分</button><button type="button" data-add="30">＋30分</button><button type="button" data-add="60">＋1時間</button><button type="button" data-add="120">＋2時間</button></div><label class="field"><span>メモ</span><textarea id="memo" rows="3" maxlength="180" placeholder="今日やったこと"></textarea></label><div class="actions"><button id="cancel" type="button" class="ghost">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<script src="common-ui.js?v=20260805b"></script><script>
(()=>{const KEY='neet-note-calendar-v1',SONG_KEYS=['neet-note-songs-v1','neetNoteSongs','songs'];const icons={note:'📝',lyrics:'🎤',voice:'🎙',idea:'💡',practice:'🎸',mix:'🎧'},labels={note:'ノート',lyrics:'歌詞',voice:'録音',idea:'アイデア',practice:'練習',mix:'ミックス'},pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let songs=[];for(const k of SONG_KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(v)&&v.length){songs=v;break}}catch{}}songs=songs.map(s=>({id:String(s.id||s.songId||s.title),title:s.title||'無題の曲'}));const today=new Date();today.setHours(0,0,0,0);let view=new Date(today.getFullYear(),today.getMonth(),1),selected=new Date(today),hours=0,minutes=30;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(data)),fmt=m=>m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`,filtered=x=>(!$('songFilter').value||x.songId===$('songFilter').value)&&(!$('typeFilter').value||x.type===$('typeFilter').value);
function fillSongs(){songs.forEach(s=>[$('songFilter'),$('activitySong')].forEach(sel=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.title;sel.appendChild(o)}))}function render(){const prefix=`${view.getFullYear()}-${pad(view.getMonth()+1)}-`;$('monthTitle').textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;$('days').innerHTML='';const start=new Date(view.getFullYear(),view.getMonth(),1-view.getDay());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),items=(data[k]||[]).filter(filtered),b=document.createElement('button');b.className='day';b.type='button';if(d.getMonth()!==view.getMonth())b.classList.add('other');if(k===key(today))b.classList.add('today');if(k===key(selected))b.classList.add('selected');b.innerHTML=`<span class="day-num">${d.getDate()}</span><span class="dots">${items.slice(0,5).map(x=>`<span class="dot">${icons[x.type]||'♪'}</span>`).join('')}</span>`;b.onclick=()=>{selected=new Date(d);render()};$('days').appendChild(b)}renderDetail();renderStats(prefix);renderHeatmap()}
function renderDetail(){const items=(data[key(selected)]||[]).filter(filtered);$('selectedTitle').textContent=`${selected.getMonth()+1}月${selected.getDate()}日の制作`;$('activities').innerHTML=items.length?items.map((x,i)=>`<div class="activity"><div><strong>${icons[x.type]||'♪'} ${labels[x.type]||'制作'}</strong>${x.songTitle?`<div><small>${esc(x.songTitle)}</small></div>`:''}${x.memo?`<div>${esc(x.memo)}</div>`:''}</div><div><strong>${fmt(Number(x.minutes)||0)}</strong><br><button class="ghost" data-del="${x.id||i}" type="button">削除</button></div></div>`).join(''):'<div class="empty">まだ記録がないよ。</div>';$('activities').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const arr=data[key(selected)]||[],idx=arr.findIndex((x,i)=>(x.id||i)==b.dataset.del);if(idx>-1)arr.splice(idx,1);if(!arr.length)delete data[key(selected)];save();render()});$('timeline').innerHTML=items.length?items.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(x=>`<div class="timeline-row"><span>${new Date(x.createdAt||Date.now()).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</span><span>${icons[x.type]} ${esc(x.memo||labels[x.type])}</span><b>${fmt(x.minutes||0)}</b></div>`).join(''):'<div class="empty">タイムラインなし</div>'}
function renderStats(prefix){const month=Object.entries(data).filter(([k,v])=>k.startsWith(prefix)&&v.some(filtered)),year=Object.entries(data).filter(([k,v])=>k.startsWith(`${view.getFullYear()}-`)&&v.some(filtered)),sum=e=>e.reduce((n,[,v])=>n+v.filter(filtered).reduce((a,x)=>a+(+x.minutes||0),0),0),count=e=>e.reduce((n,[,v])=>n+v.filter(filtered).length,0);$('statDays').textContent=month.length;$('statCount').textContent=count(month);$('statTime').textContent=fmt(sum(month));$('yearDays').textContent=year.length;$('yearTime').textContent=fmt(sum(year));let streak=0,c=new Date(today);while((data[key(c)]||[]).some(filtered)){streak++;c.setDate(c.getDate()-1)}$('statStreak').textContent=`${streak}日`}
function renderHeatmap(){$('heatmap').innerHTML='';const start=new Date(view.getFullYear(),0,1);start.setDate(start.getDate()-start.getDay());for(let i=0;i<371;i++){const d=new Date(start);d.setDate(start.getDate()+i);const mins=(data[key(d)]||[]).filter(filtered).reduce((n,x)=>n+(+x.minutes||0),0),el=document.createElement('span');el.className='heat';el.dataset.l=mins?Math.min(4,Math.ceil(mins/60)):0;el.title=`${key(d)} ${fmt(mins)}`;$('heatmap').appendChild(el)}}
function buildWheel(){for(let h=0;h<24;h++)$('hourWheel').insertAdjacentHTML('beforeend',`<button type="button" data-h="${h}">${h}時間</button>`);for(let m=0;m<60;m++)$('minuteWheel').insertAdjacentHTML('beforeend',`<button type="button" data-m="${m}">${pad(m)}分</button>`);$('hourWheel').onclick=e=>{if(e.target.dataset.h!=null){hours=+e.target.dataset.h;showTime()}};$('minuteWheel').onclick=e=>{if(e.target.dataset.m!=null){minutes=+e.target.dataset.m;showTime()}}}function showTime(){const total=Math.min(1439,hours*60+minutes);hours=Math.floor(total/60);minutes=total%60;$('timeDisplay').textContent=`${hours}時間 ${minutes}分`}
$('addActivity').onclick=()=>{$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();const k=key(selected),song=songs.find(s=>s.id===$('activitySong').value);(data[k]??=[]).push({id:String(Date.now()),type:$('activityType').value,songId:song?.id||'',songTitle:song?.title||'',minutes:hours*60+minutes,memo:$('memo').value.trim(),createdAt:Date.now()});save();$('memo').value='';$('dialog').close();render()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let t=hours*60+minutes+(+b.dataset.add);hours=Math.floor(Math.min(t,1439)/60);minutes=Math.min(t,1439)%60;showTime()});$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('today').onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);selected=new Date(today);render()};$('songFilter').onchange=render;$('typeFilter').onchange=render;$('pdf').onclick=()=>window.print();$('csv').onclick=()=>{const rows=[['日付','種類','曲','時間(分)','メモ'],...Object.entries(data).flatMap(([d,v])=>v.filter(filtered).map(x=>[d,labels[x.type]||x.type,x.songTitle||'',x.minutes||0,x.memo||'']))],csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='NEET_NOTE_制作記録.csv';a.click();URL.revokeObjectURL(a.href)};const menu=$('menu'),overlay=$('overlay'),open=()=>{menu.classList.add('open');overlay.classList.add('open')},close=()=>{menu.classList.remove('open');overlay.classList.remove('open')};$('openMenu').onclick=open;$('closeMenu').onclick=close;overlay.onclick=close;fillSongs();buildWheel();showTime();render()})();
</script><script src="menu-ui.js?v=20260805-4"></script>
