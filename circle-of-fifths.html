<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3eadc;color:#2f241b}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:calc(76px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom))}.page{width:min(980px,100%);margin:auto}.hero,.panel{border:1px solid #dfd1bd;border-radius:24px;background:linear-gradient(180deg,#fffaf2,#fffdf8);box-shadow:0 12px 34px rgba(91,62,31,.10)}.hero{padding:22px}.eyebrow{margin:0 0 7px;color:#95683f;font-size:.7rem;font-weight:900;letter-spacing:.15em}.hero h1{margin:0;font-size:clamp(1.65rem,7vw,2.7rem);line-height:1.15}.hero p{margin:10px 0 0;color:#746453;line-height:1.75}.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,.9fr);gap:16px;margin-top:16px}.panel{padding:18px}.circle-wrap{display:grid;place-items:center}.circle{--r-major:clamp(112px,34vw,148px);--r-minor:clamp(72px,24vw,102px);position:relative;width:min(100%,390px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at center,#fffdf8 0 19%,#f5eadb 19.5% 39%,#ead6bc 39.5% 63%,#f8efe4 63.5% 100%);border:1px solid #dac6aa;box-shadow:inset 0 0 0 10px rgba(255,255,255,.28),0 12px 25px rgba(84,56,28,.08)}.key-btn{position:absolute;left:50%;top:50%;z-index:2;display:grid;place-items:center;padding:0;border:1px solid #d9c3a6;background:#fffaf2;color:#3f2d1f;font:inherit;font-weight:900;box-shadow:0 4px 10px rgba(79,53,29,.08);cursor:pointer;transition:.15s transform,.15s background,.15s border-color,.15s box-shadow}.key-btn.major{width:clamp(50px,15vw,66px);height:42px;border-radius:14px;font-size:clamp(.72rem,2.4vw,.92rem);transform:translate(-50%,-50%) rotate(calc(var(--i)*30deg)) translateY(calc(var(--r-major)*-1)) rotate(calc(var(--i)*-30deg))}.key-btn.minor{width:clamp(45px,13vw,57px);height:34px;border-radius:999px;font-size:clamp(.62rem,2vw,.78rem);background:#f2e5d3;transform:translate(-50%,-50%) rotate(calc(var(--i)*30deg)) translateY(calc(var(--r-minor)*-1)) rotate(calc(var(--i)*-30deg))}.key-btn:hover{border-color:#b98a55;box-shadow:0 6px 16px rgba(89,58,29,.14)}.key-btn.active{background:#8d6239;color:#fff;border-color:#6f4827;box-shadow:0 0 0 4px rgba(141,98,57,.14),0 7px 16px rgba(76,48,25,.20)}.key-btn.related{border-color:#c79b69;background:#fff3df}.key-btn.active.related{background:#8d6239}.center{position:absolute;left:50%;top:50%;z-index:1;display:grid;place-items:center;width:35%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fffaf2;border:1px solid #d5bea0;text-align:center;box-shadow:0 7px 18px rgba(84,55,29,.10)}.center b{font-size:clamp(1.2rem,5vw,1.9rem)}.center span{display:block;margin-top:3px;color:#846d57;font-size:.68rem;font-weight:800}.legend{display:flex;justify-content:center;gap:14px;margin-top:14px;color:#746453;font-size:.73rem;font-weight:800}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;vertical-align:-1px}.legend .maj{background:#fffaf2;border:1px solid #b89066}.legend .min{background:#e8d7c1;border:1px solid #b89066}.summary{display:grid;gap:12px}.headline{padding:14px;border-radius:18px;background:#f6ecde;border:1px solid #e2cfb5}.headline small{display:block;color:#8b7158;font-weight:850}.headline strong{display:block;margin-top:3px;font-size:1.65rem}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fact{padding:11px;border:1px solid #e5d7c5;border-radius:14px;background:#fffdf9}.fact small{display:block;color:#8b7763;font-size:.66rem;font-weight:850}.fact b{display:block;margin-top:4px;font-size:.9rem}.section{padding-top:3px}.section h2{margin:0 0 9px;font-size:.94rem}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip,.note-btn{border:1px solid #dbc7ac;border-radius:999px;background:#fffaf2;color:#4b3422;padding:7px 10px;font:inherit;font-size:.78rem;font-weight:850}.note-btn{cursor:pointer}.note-btn:active{transform:scale(.96);background:#efe0cd}.related-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.related-card{padding:10px 6px;border:1px solid #e0ceb6;border-radius:13px;background:#fffaf3;text-align:center}.related-card small{display:block;color:#8b7763;font-size:.62rem;font-weight:850}.related-card b{display:block;margin-top:4px;font-size:.82rem}.chord-tabs{display:flex;gap:7px;margin-bottom:8px}.tab{flex:1;min-height:38px;border:1px solid #dbc7ac;border-radius:11px;background:#fffaf2;color:#59412e;font:inherit;font-weight:850}.tab.active{background:#8d6239;color:#fff;border-color:#8d6239}.chords{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.chord{display:grid;grid-template-columns:42px 1fr;align-items:center;padding:9px;border:1px solid #e4d4c0;border-radius:12px;background:#fffdf9}.chord em{font-style:normal;color:#9a7b5c;font-size:.65rem;font-weight:900}.chord b{font-size:.84rem}.tip{margin-top:12px;padding:11px 12px;border-radius:13px;background:#f1e5d3;color:#6a503a;font-size:.74rem;line-height:1.6}.ngm-top-return,.neet-top-return{display:none!important}
html[data-theme="dark"] body{background:#241f1a;color:#f6eee3}html[data-theme="dark"] .hero,html[data-theme="dark"] .panel{background:#2d2721;border-color:#8c683d;box-shadow:0 14px 34px rgba(0,0,0,.24)}html[data-theme="dark"] .hero p,html[data-theme="dark"] .legend{color:#d5c2ad}html[data-theme="dark"] .circle{background:radial-gradient(circle at center,#302921 0 19%,#3a3027 19.5% 39%,#473828 39.5% 63%,#302921 63.5% 100%);border-color:#7d5d38}html[data-theme="dark"] .key-btn,html[data-theme="dark"] .center,html[data-theme="dark"] .fact,html[data-theme="dark"] .related-card,html[data-theme="dark"] .chip,html[data-theme="dark"] .note-btn,html[data-theme="dark"] .tab,html[data-theme="dark"] .chord{background:#332b24;color:#f4eadf;border-color:#795b3a}html[data-theme="dark"] .key-btn.minor{background:#3b3128}html[data-theme="dark"] .key-btn.related{background:#4b3826;border-color:#c08b50}html[data-theme="dark"] .key-btn.active,html[data-theme="dark"] .tab.active{background:#a7793d;border-color:#c99a58;color:white}html[data-theme="dark"] .headline,html[data-theme="dark"] .tip{background:#3a3027;border-color:#745634;color:#ead6bd}html[data-theme="dark"] .center span,html[data-theme="dark"] .fact small,html[data-theme="dark"] .related-card small{color:#c7b39e}
@media(max-width:760px){body{padding-left:8px;padding-right:8px}.hero,.panel{border-radius:20px}.hero{padding:18px}.layout{grid-template-columns:1fr}.panel{padding:13px}.circle{--r-major:clamp(106px,34vw,132px);--r-minor:clamp(69px,23vw,90px)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.chords{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.circle{--r-major:106px;--r-minor:68px}.key-btn.major{width:48px;height:38px}.key-btn.minor{width:43px;height:31px}.panel{padding:10px}.related-box{grid-template-columns:1fr 1fr 1fr}.chord{grid-template-columns:35px 1fr;padding:7px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<main class="page">
<section class="hero"><p class="eyebrow">THEORY TOOL</p><h1>インタラクティブ五度圏</h1><p>外側のメジャーキー／内側のマイナーキーをタップすると、調号・構成音・近親調・ダイアトニックコードをまとめて確認できます。</p></section>
<div class="layout">
<section class="panel circle-wrap" aria-label="五度圏"><div id="circle" class="circle"><div class="center"><div><b id="centerKey">C</b><span id="centerMode">メジャー</span></div></div></div><div class="legend"><span><i class="maj"></i>メジャー</span><span><i class="min"></i>マイナー</span></div></section>
<section class="panel summary"><div class="headline"><small>SELECTED KEY</small><strong id="titleKey">Cメジャー</strong></div><div class="facts"><div class="fact"><small>調号</small><b id="signature">♮ なし</b></div><div class="fact"><small id="relativeLabel">平行調</small><b id="relative">Aマイナー</b></div></div><section class="section"><h2>構成音 <small style="font-weight:500;color:#8b7763">（タップで試聴）</small></h2><div id="notes" class="chips"></div></section><section class="section"><h2>近親調</h2><div id="related" class="related-box"></div></section><section class="section"><h2>ダイアトニックコード</h2><div class="chord-tabs"><button id="triadTab" class="tab active" type="button">三和音</button><button id="seventhTab" class="tab" type="button">7th</button></div><div id="chords" class="chords"></div></section><div id="tip" class="tip"></div></section>
</div>
</main>
<script>
(()=>{
'use strict';
const majors=[
 {label:'C',root:'C',minor:'Am',sig:'♮ なし',notes:['C','D','E','F','G','A','B']},
 {label:'G',root:'G',minor:'Em',sig:'♯ × 1',notes:['G','A','B','C','D','E','F♯']},
 {label:'D',root:'D',minor:'Bm',sig:'♯ × 2',notes:['D','E','F♯','G','A','B','C♯']},
 {label:'A',root:'A',minor:'F♯m',sig:'♯ × 3',notes:['A','B','C♯','D','E','F♯','G♯']},
 {label:'E',root:'E',minor:'C♯m',sig:'♯ × 4',notes:['E','F♯','G♯','A','B','C♯','D♯']},
 {label:'B',root:'B',minor:'G♯m',sig:'♯ × 5',notes:['B','C♯','D♯','E','F♯','G♯','A♯']},
 {label:'F♯/G♭',root:'F♯',minor:'D♯m/E♭m',sig:'♯ × 6 / ♭ × 6',notes:['F♯','G♯','A♯','B','C♯','D♯','E♯']},
 {label:'D♭',root:'D♭',minor:'B♭m',sig:'♭ × 5',notes:['D♭','E♭','F','G♭','A♭','B♭','C']},
 {label:'A♭',root:'A♭',minor:'Fm',sig:'♭ × 4',notes:['A♭','B♭','C','D♭','E♭','F','G']},
 {label:'E♭',root:'E♭',minor:'Cm',sig:'♭ × 3',notes:['E♭','F','G','A♭','B♭','C','D']},
 {label:'B♭',root:'B♭',minor:'Gm',sig:'♭ × 2',notes:['B♭','C','D','E♭','F','G','A']},
 {label:'F',root:'F',minor:'Dm',sig:'♭ × 1',notes:['F','G','A','B♭','C','D','E']}
];
const minorNames=['Am','Em','Bm','F♯m','C♯m','G♯m','D♯m/E♭m','B♭m','Fm','Cm','Gm','Dm'];
const romanMajTri=['I','ii','iii','IV','V','vi','vii°'],qualMajTri=['','m','m','','','m','°'];
const romanMaj7=['Imaj7','iim7','iiim7','IVmaj7','V7','vim7','viiø7'],qualMaj7=['maj7','m7','m7','maj7','7','m7','m7♭5'];
const romanMinTri=['i','ii°','III','iv','v','VI','VII'],qualMinTri=['m','°','','m','m','',''];
const romanMin7=['im7','iiø7','IIImaj7','ivm7','vm7','VImaj7','VII7'],qualMin7=['m7','m7♭5','maj7','m7','m7','maj7','7'];
let selected={index:0,mode:'major'},chordType='triad';
const circle=document.getElementById('circle');
const esc=s=>s.replaceAll('♯','#').replaceAll('♭','b');
const displayMinor=s=>s.replace(/m$/,'マイナー').replace('m/','マイナー / ').replace(/m$/,'マイナー');
function createButtons(){majors.forEach((k,i)=>{const a=document.createElement('button');a.type='button';a.className='key-btn major';a.style.setProperty('--i',i);a.textContent=k.label;a.dataset.i=i;a.dataset.mode='major';a.setAttribute('aria-label',k.label+'メジャー');a.onclick=()=>select(i,'major');circle.appendChild(a);const m=document.createElement('button');m.type='button';m.className='key-btn minor';m.style.setProperty('--i',i);m.textContent=minorNames[i];m.dataset.i=i;m.dataset.mode='minor';m.setAttribute('aria-label',minorNames[i]+'マイナー');m.onclick=()=>select(i,'minor');circle.appendChild(m)})}
function minorNotes(i){const n=majors[i].notes;return [n[5],n[6],n[0],n[1],n[2],n[3],n[4]]}
function modeTitle(){const k=majors[selected.index];return selected.mode==='major'?`${k.label}メジャー`:`${minorNames[selected.index].replace('m/','m / ')} マイナー`}
function keyRoot(){return selected.mode==='major'?majors[selected.index].label:minorNames[selected.index].replace(/m.*/,'')}
function chordName(note,q){return note+q}
function render(){const {index:i,mode}=selected,k=majors[i];const notes=mode==='major'?k.notes:minorNotes(i);document.querySelectorAll('.key-btn').forEach(b=>{const bi=+b.dataset.i;b.classList.toggle('active',bi===i&&b.dataset.mode===mode);b.classList.remove('related');if(b.dataset.mode===mode&&(bi===(i+11)%12||bi===(i+1)%12))b.classList.add('related');if(b.dataset.mode!==mode&&bi===i)b.classList.add('related')});document.getElementById('centerKey').textContent=mode==='major'?k.label:minorNames[i];document.getElementById('centerMode').textContent=mode==='major'?'メジャー':'マイナー';document.getElementById('titleKey').textContent=modeTitle();document.getElementById('signature').textContent=k.sig;document.getElementById('relativeLabel').textContent='平行調';document.getElementById('relative').textContent=mode==='major'?minorNames[i].replace('m/','m / '):k.label+'メジャー';const notesEl=document.getElementById('notes');notesEl.innerHTML='';notes.forEach((n,idx)=>{const b=document.createElement('button');b.type='button';b.className='note-btn';b.textContent=(idx+1)+' · '+n;b.onclick=()=>play(n,idx);notesEl.appendChild(b)});const rel=document.getElementById('related');const left=(i+11)%12,right=(i+1)%12;const cards=mode==='major'?[['下属調',majors[left].label+'メジャー'],['平行調',minorNames[i]],['属調',majors[right].label+'メジャー']]:[['隣の短調',minorNames[left]],['平行調',k.label+'メジャー'],['隣の短調',minorNames[right]]];rel.innerHTML=cards.map(([a,b])=>`<div class="related-card"><small>${a}</small><b>${b}</b></div>`).join('');renderChords(notes);document.getElementById('tip').textContent=mode==='major'?`${k.label}メジャーでは、五度圏で左右に隣り合う調ほど共通音・共通コードが多く、転調先として自然につながりやすいです。`:`${minorNames[i]}は${k.label}メジャーと同じ調号を持つ平行調です。ここではナチュラルマイナー基準で表示しています。`}
function renderChords(notes){const min=selected.mode==='minor',seventh=chordType==='seventh';const romans=min?(seventh?romanMin7:romanMinTri):(seventh?romanMaj7:romanMajTri);const quals=min?(seventh?qualMin7:qualMinTri):(seventh?qualMaj7:qualMajTri);document.getElementById('chords').innerHTML=notes.map((n,i)=>`<div class="chord"><em>${romans[i]}</em><b>${chordName(n,quals[i])}</b></div>`).join('')}
function select(i,mode){selected={index:i,mode};render()}
function semitone(note){const m={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11};return m[esc(note).split('/')[0]]??0}
function play(note,degree){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;window.__fifthsAC=window.__fifthsAC||new AC();const ac=window.__fifthsAC;if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();let midi=60+semitone(note);if(degree>3&&semitone(note)<semitone((selected.mode==='major'?majors[selected.index].notes:minorNotes(selected.index))[0]))midi+=12;o.frequency.value=440*Math.pow(2,(midi-69)/12);o.type='triangle';g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.17,ac.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.42);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.45)}
document.getElementById('triadTab').onclick=()=>{chordType='triad';triadTab.classList.add('active');seventhTab.classList.remove('active');render()};document.getElementById('seventhTab').onclick=()=>{chordType='seventh';seventhTab.classList.add('active');triadTab.classList.remove('active');render()};createButtons();render();
})();
</script>
