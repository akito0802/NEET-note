<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9c7a8">
<title>NEET NOTE TOOLS</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css?v=3">
<style>
:root{--paper:#fffdf8;--ink:#1f2937;--line:#ded6c9;--accent:#8b6f47}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4efe6;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a{text-decoration:none;color:var(--ink);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(80,60,30,.06)}.card.wide{grid-column:1/-1}h1{font-size:1.55rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:white}button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#8b6f47;color:white;font-weight:750;cursor:pointer}.sub{background:#eee7dc;color:#392f23}.danger{background:#a43d3d}.result{min-height:46px;padding:12px;border-radius:12px;background:#f7f2e9;white-space:pre-wrap;word-break:break-word}.small{font-size:.82rem;color:#6b7280}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee7dc;margin:2px;font-size:.78rem}.meter{height:10px;border-radius:99px;background:#e5e7eb;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#8b6f47;transition:.08s}.song{padding:10px 0;border-bottom:1px solid #ebe5da}.song:last-child{border:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.top{align-items:flex-start}}
</style>
</head>
<body><main class="wrap"><header class="top"><div><div class="small">NEET NOTE ★4 TOOLKIT</div><h1>作曲・演奏支援</h1></div><a href="./?mode=note">← ノートへ</a></header>
<div class="grid">
<section class="card"><h2>🎲 コード進行ルーレット</h2><div class="row"><select id="rKey"></select><select id="rMode"><option value="major">メジャー</option><option value="minor">マイナー</option></select><select id="rStyle"><option value="pop">ポップ</option><option value="rock">ロック</option><option value="ballad">バラード</option><option value="jazz">ジャズ</option></select></div><button id="roulette">進行を生成</button><div id="rouletteOut" class="result">C - G - Am - F</div><div class="row"><button id="copyRoulette" class="sub">コピー</button></div></section>
<section class="card"><h2>🔁 移調・カポ変換</h2><textarea id="transposeIn" rows="4" placeholder="例：C G Am F / C/E"></textarea><div class="row"><select id="fromKey"></select><select id="toKey"></select></div><div class="row"><button id="transpose">移調する</button><select id="capo"><option value="0">カポなし</option></select></div><div id="transposeOut" class="result">変換結果</div></section>
<section class="card"><h2>⏱ メトロノーム</h2><div class="row"><input id="bpm" type="number" min="30" max="240" value="120"><select id="beats"><option>4</option><option>3</option><option>6</option></select></div><button id="metro">スタート</button><p id="beatText" class="result">120 BPM / 4拍子</p></section>
<section class="card"><h2>🎸 チューナー</h2><button id="tuner">マイクを開始</button><div id="note" class="result" style="font-size:1.8rem;text-align:center">--</div><div class="meter"><i id="tuneMeter"></i></div><p class="small">中央に近いほど音程が合ってるよ。マイク許可が必要。</p></section>
<section class="card"><h2>🥁 ドラム</h2><div class="row"><select id="drumStyle"><option value="rock">ロック</option><option value="pop">ポップ</option><option value="four">4つ打ち</option></select><input id="drumBpm" type="number" min="50" max="220" value="110"></div><button id="drum">スタート</button><p id="drumText" class="result">ロック / 110 BPM</p></section>
<section class="card"><h2>✨ AI Composer</h2><p>保存中の曲を選んで、既存のAI作曲アシスタントに引き継げるよ。</p><select id="aiSong"></select><div class="row"><button id="openAi">AI作曲を開く</button></div></section>
<section class="card wide"><h2>🗂 楽曲管理・バックアップ</h2><div class="row"><input id="songSearch" placeholder="曲名・作家・コード・雰囲気で検索"><button id="export" class="sub">JSON書き出し</button><label class="btn sub">JSON読込み<input id="import" type="file" accept="application/json" hidden></label></div><div id="songStats" class="small"></div><div id="managedSongs"></div></section>
</div></main>
<script>
const STORE='song-note-songs-v1',N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FLAT={'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'},idx=n=>N.indexOf(({'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}[n]||n));
function fillKeys(){['rKey','fromKey','toKey'].forEach(id=>{document.getElementById(id).innerHTML=N.map(n=>`<option>${n}</option>`).join('')});for(let i=0;i<=11;i++)capo.innerHTML+=`<option value="${i}">カポ${i}</option>`}fillKeys();
const degrees={major:['','m','m','','','m','dim'],minor:['m','dim','','m','m','','']},steps={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]},patterns={pop:[[1,5,6,4],[6,4,1,5],[1,6,4,5]],rock:[[1,4,5,4],[1,5,4,1],[6,4,1,5]],ballad:[[1,3,4,5],[1,5,6,3],[4,5,3,6]],jazz:[[2,5,1,6],[1,6,2,5],[3,6,2,5]]};
function chord(key,mode,d){let root=N[(idx(key)+steps[mode][d-1])%12],q=degrees[mode][d-1];if(rStyle.value==='jazz')q=q==='m'?'m7':q==='dim'?'m7b5':'maj7';return root+q}
roulette.onclick=()=>{const p=patterns[rStyle.value][Math.floor(Math.random()*patterns[rStyle.value].length)];rouletteOut.textContent=p.map(d=>chord(rKey.value,rMode.value,d)).join(' - ')};copyRoulette.onclick=()=>navigator.clipboard.writeText(rouletteOut.textContent);
function shiftToken(t,semitones){return t.replace(/([A-G](?:#|b)?)/g,(m)=>{const i=idx(m);if(i<0)return m;return N[(i+semitones+120)%12]})}
transpose.onclick=()=>{const s=idx(toKey.value)-idx(fromKey.value);transposeOut.textContent=transposeIn.value.replace(/\b[A-G](?:#|b)?(?:mMaj7|maj7|m7b5|m7|m|dim7|dim|aug|sus2|sus4|add9|7|6|9|11|13)?(?:\/[A-G](?:#|b)?)?/g,m=>shiftToken(m,s))};capo.onchange=()=>{const c=Number(capo.value),s=-c;transposeOut.textContent=transposeIn.value.replace(/\b[A-G](?:#|b)?(?:mMaj7|maj7|m7b5|m7|m|dim7|dim|aug|sus2|sus4|add9|7|6|9|11|13)?(?:\/[A-G](?:#|b)?)?/g,m=>shiftToken(m,s));toKey.value=N[(idx(fromKey.value)+s+12)%12]};
let ac,metroTimer=0,beat=0;function clickSound(freq=900,d=.05){ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}metro.onclick=()=>{if(metroTimer){clearInterval(metroTimer);metroTimer=0;metro.textContent='スタート';return}beat=0;const run=()=>{beat=(beat%Number(beats.value))+1;clickSound(beat===1?1200:800);beatText.textContent=`${bpm.value} BPM / ${beat}拍目`};run();metroTimer=setInterval(run,60000/Number(bpm.value));metro.textContent='ストップ'};
let stream,raf;tuner.onclick=async()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cancelAnimationFrame(raf);tuner.textContent='マイクを開始';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const c=new(window.AudioContext||window.webkitAudioContext)(),src=c.createMediaStreamSource(stream),an=c.createAnalyser();an.fftSize=2048;src.connect(an);const buf=new Float32Array(an.fftSize);function loop(){an.getFloatTimeDomainData(buf);let best=-1,bestCorr=0;for(let lag=20;lag<1000;lag++){let corr=0;for(let i=0;i<buf.length-lag;i++)corr+=buf[i]*buf[i+lag];if(corr>bestCorr){bestCorr=corr;best=lag}}if(best>0){const f=c.sampleRate/best,m=69+12*Math.log2(f/440),nearest=Math.round(m),name=N[(nearest%12+12)%12],cents=Math.round((m-nearest)*100);note.textContent=`${name} ${Math.round(f)}Hz ${cents>0?'+':''}${cents}¢`;tuneMeter.style.width=`${Math.max(0,Math.min(100,50+cents))}%`}raf=requestAnimationFrame(loop)}loop();tuner.textContent='停止'}catch(e){note.textContent='マイクを使用できません'}};
let drumTimer=0,step=0;function noise(type){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(type==='kick'){clickSound(90,.12);return}const b=ac.createBuffer(1,ac.sampleRate*.06,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=type==='snare'?.13:.05;s.connect(g).connect(ac.destination);s.start()}
drum.onclick=()=>{if(drumTimer){clearInterval(drumTimer);drumTimer=0;drum.textContent='スタート';return}step=0;const run=()=>{const st=drumStyle.value;if(st==='four'||step%4===0)noise('kick');if((st!=='four')&&(step%8===4))noise('snare');if(step%2===0)noise('hat');step=(step+1)%16;drumText.textContent=`${drumStyle.options[drumStyle.selectedIndex].text} / ${drumBpm.value} BPM / ${step+1}`};run();drumTimer=setInterval(run,60000/Number(drumBpm.value)/4);drum.textContent='ストップ'};
function songs(){try{return JSON.parse(localStorage.getItem(STORE))||[]}catch{return[]}}function renderSongs(){const all=songs(),q=songSearch.value.toLowerCase(),list=all.filter(s=>Object.values(s).join(' ').toLowerCase().includes(q));songStats.textContent=`全${all.length}曲・表示${list.length}曲`;managedSongs.innerHTML=list.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).map(s=>`<div class="song"><b>${s.title||'無題の曲'}</b><div class="small">${[s.artist,s.key&&'Key '+s.key,s.bpm&&s.bpm+' BPM'].filter(Boolean).join(' · ')}</div>${[s.mood,s.theme].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('')}</div>`).join('')||'<p class="small">曲がありません</p>';aiSong.innerHTML=all.map(s=>`<option value="${s.id}">${s.title||'無題の曲'}</option>`).join('')}songSearch.oninput=renderSongs;renderSongs();openAi.onclick=()=>{if(aiSong.value)location.href=`ai.html?song=${encodeURIComponent(aiSong.value)}`};
export.onclick=()=>{const blob=new Blob([JSON.stringify(songs(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`neet-note-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};import.onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw 0;if(confirm(`${data.length}曲を読み込み、現在のデータを置き換えますか？`)){localStorage.setItem(STORE,JSON.stringify(data));renderSongs()}}catch{alert('正しいNEET NOTEのJSONを選んでね')}};
</script></body></html>
