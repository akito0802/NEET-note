<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9c7a8">
<title>NEET NOTE TOOLS</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css?v=3">
<style>
:root{--paper:#fffdf8;--ink:#1f2937;--line:#ded6c9;--accent:#8b6f47}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4efe6;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a{text-decoration:none;color:var(--ink);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(80,60,30,.06)}.card.wide{grid-column:1/-1}h1{font-size:1.55rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:white}button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#8b6f47;color:white;font-weight:750;cursor:pointer}.sub{background:#eee7dc;color:#392f23}.result{min-height:46px;padding:12px;border-radius:12px;background:#f7f2e9;white-space:pre-wrap;word-break:break-word}.small{font-size:.82rem;color:#6b7280}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee7dc;margin:2px;font-size:.78rem}.meter{height:10px;border-radius:99px;background:#e5e7eb;overflow:hidden}.meter i{display:block;height:100%;width:50%;background:#8b6f47;transition:.08s}.song{padding:10px 0;border-bottom:1px solid #ebe5da}.song:last-child{border:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.top{align-items:flex-start}}
</style>
</head>
<body><main class="wrap"><header class="top"><div><div class="small">NEET NOTE ★4 TOOLKIT</div><h1>作曲・演奏支援</h1></div><a href="./?mode=note">← ノートへ</a></header>
<div class="grid">
<section class="card"><h2>🎲 コード進行ルーレット</h2><div class="row"><select id="rKey"></select><select id="rMode"><option value="major">メジャー</option><option value="minor">マイナー</option></select><select id="rStyle"><option value="pop">ポップ</option><option value="rock">ロック</option><option value="ballad">バラード</option><option value="jazz">ジャズ</option></select></div><button id="roulette">進行を生成</button><div id="rouletteOut" class="result">C - G - Am - F</div><div class="row"><button id="copyRoulette" class="sub">コピー</button></div></section>
<section class="card"><h2>🔁 移調・カポ変換</h2><textarea id="transposeIn" rows="4" placeholder="例：C G Am F / C/E"></textarea><div class="row"><select id="fromKey"></select><select id="toKey"></select></div><div class="row"><button id="transpose">移調する</button><select id="capo"><option value="0">カポなし</option></select></div><div id="transposeOut" class="result">変換結果</div></section>
<section class="card"><h2>⏱ メトロノーム</h2><div class="row"><input id="bpm" type="number" min="30" max="240" value="120"><select id="beats"><option value="4">4拍子</option><option value="3">3拍子</option><option value="6">6拍子</option></select></div><button id="metro">スタート</button><p id="beatText" class="result">120 BPM / 4拍子</p></section>
<section class="card"><h2>🎸 チューナー</h2><button id="tuner">マイクを開始</button><div id="note" class="result" style="font-size:1.8rem;text-align:center">--</div><div class="meter"><i id="tuneMeter"></i></div><p class="small">中央に近いほど音程が合ってるよ。マイク許可が必要。</p></section>
<section class="card"><h2>🥁 ドラム</h2><div class="row"><select id="drumStyle"><option value="rock">ロック</option><option value="pop">ポップ</option><option value="four">4つ打ち</option></select><input id="drumBpm" type="number" min="50" max="220" value="110"></div><button id="drum">スタート</button><p id="drumText" class="result">ロック / 110 BPM</p></section>
<section class="card"><h2>✨ AI Composer</h2><p>保存中の曲を選んで、既存のAI作曲アシスタントに引き継げるよ。</p><select id="aiSong"></select><div class="row"><button id="openAi">AI作曲を開く</button></div></section>
<section class="card wide"><h2>🗂 楽曲管理・バックアップ</h2><div class="row"><input id="songSearch" placeholder="曲名・作家・コード・雰囲気で検索"><button id="exportBtn" class="sub">JSON書き出し</button><label class="btn sub">JSON読込み<input id="importFile" type="file" accept="application/json" hidden></label></div><div id="songStats" class="small"></div><div id="managedSongs"></div></section>
</div></main>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const STORE='song-note-songs-v1';
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const aliases={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const idx=n=>N.indexOf(aliases[n]||n);
const els={rKey:$('rKey'),rMode:$('rMode'),rStyle:$('rStyle'),roulette:$('roulette'),rouletteOut:$('rouletteOut'),copyRoulette:$('copyRoulette'),transposeIn:$('transposeIn'),fromKey:$('fromKey'),toKey:$('toKey'),transpose:$('transpose'),capo:$('capo'),transposeOut:$('transposeOut'),bpm:$('bpm'),beats:$('beats'),metro:$('metro'),beatText:$('beatText'),tuner:$('tuner'),note:$('note'),tuneMeter:$('tuneMeter'),drumStyle:$('drumStyle'),drumBpm:$('drumBpm'),drum:$('drum'),drumText:$('drumText'),aiSong:$('aiSong'),openAi:$('openAi'),songSearch:$('songSearch'),exportBtn:$('exportBtn'),importFile:$('importFile'),songStats:$('songStats'),managedSongs:$('managedSongs')};
function fillKeys(){const html=N.map(n=>`<option value="${n}">${n}</option>`).join('');els.rKey.innerHTML=html;els.fromKey.innerHTML=html;els.toKey.innerHTML=html;for(let i=1;i<=11;i++)els.capo.insertAdjacentHTML('beforeend',`<option value="${i}">カポ${i}</option>`)}
fillKeys();els.toKey.value='G';
const degrees={major:['','m','m','','','m','dim'],minor:['m','dim','','m','m','','']};
const steps={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
const patterns={pop:[[1,5,6,4],[6,4,1,5],[1,6,4,5]],rock:[[1,4,5,4],[1,5,4,1],[6,4,1,5]],ballad:[[1,3,4,5],[1,5,6,3],[4,5,3,6]],jazz:[[2,5,1,6],[1,6,2,5],[3,6,2,5]]};
function chord(key,mode,d){const root=N[(idx(key)+steps[mode][d-1]+12)%12];let q=degrees[mode][d-1];if(els.rStyle.value==='jazz')q=q==='m'?'m7':q==='dim'?'m7b5':'maj7';return root+q}
els.roulette.addEventListener('click',()=>{const list=patterns[els.rStyle.value];const p=list[Math.floor(Math.random()*list.length)];els.rouletteOut.textContent=p.map(d=>chord(els.rKey.value,els.rMode.value,d)).join(' - ')});
els.copyRoulette.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(els.rouletteOut.textContent);els.copyRoulette.textContent='コピー済み';setTimeout(()=>els.copyRoulette.textContent='コピー',1000)}catch{alert('コピーできなかったよ')}});
function shiftNote(note,semitones){const i=idx(note);return i<0?note:N[(i+semitones+120)%12]}
function shiftChord(token,semitones){return token.replace(/^([A-G](?:#|b)?)/,(m)=>shiftNote(m,semitones)).replace(/\/([A-G](?:#|b)?)/,(m,n)=>'/'+shiftNote(n,semitones))}
function transform(text,semitones){return text.replace(/\b[A-G](?:#|b)?(?:mMaj7|maj13|maj11|maj9|maj7|m13|m11|m9|m7b5|m7|m|dim7|dim|aug|sus2|sus4|add11|add9|7|6|9|11|13|5)?(?:\/[A-G](?:#|b)?)?/g,m=>shiftChord(m,semitones))}
els.transpose.addEventListener('click',()=>{const s=idx(els.toKey.value)-idx(els.fromKey.value);els.transposeOut.textContent=transform(els.transposeIn.value,s)||'コードを入力してね'});
els.capo.addEventListener('change',()=>{const c=Number(els.capo.value);els.transposeOut.textContent=transform(els.transposeIn.value,-c)||'コードを入力してね'});
let audioCtx=null,metroTimer=null,beat=0;
function ctx(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq=900,d=.05,volume=.16){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.setValueAtTime(volume,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}
function stopMetro(){if(metroTimer){clearInterval(metroTimer);metroTimer=null}els.metro.textContent='スタート'}
els.metro.addEventListener('click',()=>{if(metroTimer){stopMetro();return}const bpm=Math.max(30,Math.min(240,Number(els.bpm.value)||120));const beats=Math.max(1,Number(els.beats.value)||4);beat=0;const run=()=>{beat=beat%beats+1;tone(beat===1?1200:800);els.beatText.textContent=`${bpm} BPM / ${beat}拍目`};run();metroTimer=setInterval(run,60000/bpm);els.metro.textContent='ストップ'});
let tunerStream=null,tunerRaf=null,tunerCtx=null;
function autoCorrelate(buf,sampleRate){let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);if(rms<.01)return -1;let bestOffset=-1,best=0;for(let offset=20;offset<Math.min(1000,buf.length/2);offset++){let corr=0;for(let i=0;i<buf.length-offset;i++)corr+=buf[i]*buf[i+offset];if(corr>best){best=corr;bestOffset=offset}}return bestOffset>0?sampleRate/bestOffset:-1}
function stopTuner(){if(tunerStream)tunerStream.getTracks().forEach(t=>t.stop());tunerStream=null;if(tunerRaf)cancelAnimationFrame(tunerRaf);tunerRaf=null;if(tunerCtx)tunerCtx.close();tunerCtx=null;els.tuner.textContent='マイクを開始'}
els.tuner.addEventListener('click',async()=>{if(tunerStream){stopTuner();return}try{tunerStream=await navigator.mediaDevices.getUserMedia({audio:true});tunerCtx=new(window.AudioContext||window.webkitAudioContext)();const src=tunerCtx.createMediaStreamSource(tunerStream),an=tunerCtx.createAnalyser();an.fftSize=2048;src.connect(an);const buf=new Float32Array(an.fftSize);const loop=()=>{an.getFloatTimeDomainData(buf);const f=autoCorrelate(buf,tunerCtx.sampleRate);if(f>0){const midi=69+12*Math.log2(f/440),nearest=Math.round(midi),name=N[(nearest%12+12)%12],cents=Math.round((midi-nearest)*100);els.note.textContent=`${name} ${Math.round(f)}Hz ${cents>=0?'+':''}${cents}¢`;els.tuneMeter.style.width=`${Math.max(0,Math.min(100,50+cents))}%`}else els.note.textContent='音を鳴らしてね';tunerRaf=requestAnimationFrame(loop)};loop();els.tuner.textContent='停止'}catch(e){els.note.textContent='マイクを許可してね';stopTuner()}});
let drumTimer=null,drumStep=0;
function noise(type){const c=ctx();if(type==='kick'){tone(90,.12,.25);return}const b=c.createBuffer(1,c.sampleRate*.07,c.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=type==='snare'?.13:.05;s.connect(g).connect(c.destination);s.start()}
function stopDrum(){if(drumTimer){clearInterval(drumTimer);drumTimer=null}els.drum.textContent='スタート'}
els.drum.addEventListener('click',()=>{if(drumTimer){stopDrum();return}const bpm=Math.max(50,Math.min(220,Number(els.drumBpm.value)||110));drumStep=0;const run=()=>{const st=els.drumStyle.value;if(st==='four'||drumStep%4===0)noise('kick');if(st!=='four'&&drumStep%8===4)noise('snare');if(drumStep%2===0)noise('hat');drumStep=(drumStep+1)%16;els.drumText.textContent=`${els.drumStyle.options[els.drumStyle.selectedIndex].text} / ${bpm} BPM / ${drumStep+1}`};run();drumTimer=setInterval(run,60000/bpm/4);els.drum.textContent='ストップ'});
function loadSongs(){try{const v=JSON.parse(localStorage.getItem(STORE));return Array.isArray(v)?v:[]}catch{return[]}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderSongs(){const all=loadSongs(),q=els.songSearch.value.trim().toLowerCase(),list=all.filter(s=>Object.values(s).join(' ').toLowerCase().includes(q));els.songStats.textContent=`全${all.length}曲・表示${list.length}曲`;els.managedSongs.innerHTML=list.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).map(s=>`<div class="song"><b>${esc(s.title||'無題の曲')}</b><div class="small">${[s.artist,s.key&&'Key '+s.key,s.bpm&&s.bpm+' BPM'].filter(Boolean).map(esc).join(' · ')}</div></div>`).join('')||'<p class="small">曲がありません</p>';els.aiSong.innerHTML=all.map(s=>`<option value="${esc(s.id)}">${esc(s.title||'無題の曲')}</option>`).join('')||'<option value="">曲がありません</option>'}
els.songSearch.addEventListener('input',renderSongs);renderSongs();
els.openAi.addEventListener('click',()=>{if(els.aiSong.value)location.href=`ai.html?song=${encodeURIComponent(els.aiSong.value)}`;else alert('先に曲を作ってね')});
els.exportBtn.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(loadSongs(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`neet-note-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
els.importFile.addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data))throw new Error();if(confirm(`${data.length}曲を読み込み、現在のデータを置き換えますか？`)){localStorage.setItem(STORE,JSON.stringify(data));renderSongs();alert('読み込み完了！')}}catch{alert('正しいNEET NOTEのJSONを選んでね')}finally{e.target.value=''}});
window.addEventListener('pagehide',()=>{stopMetro();stopDrum();stopTuner()});
})();
</script></body></html>
