<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9c7a8">
<title>ページが見つかりません | NEET NOTE</title>
<link rel="icon" href="favicon.svg?v=1">
<link rel="stylesheet" href="common-ui.css?v=1">
<style>
:root{--bg:#eee7dc;--card:#fffdf8;--text:#27231f;--muted:#746b61;--line:#d9cfc1;--accent:#7b5b3d}html[data-theme="dark"]{--bg:#141311;--card:#211f1c;--text:#f5efe7;--muted:#b9afa4;--line:#403a34;--accent:#d3aa7d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,var(--card),var(--bg));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,680px);padding:clamp(24px,6vw,48px);text-align:center;border:1px solid var(--line);border-radius:28px;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 24px 70px rgba(0,0,0,.14)}img{width:min(52vw,230px);aspect-ratio:1;object-fit:cover;border-radius:42px;box-shadow:0 14px 34px rgba(0,0,0,.18)}.code{margin:24px 0 2px;font-size:.76rem;font-weight:900;letter-spacing:.25em;color:var(--muted)}h1{margin:0;font-size:clamp(2rem,8vw,3.5rem)}p{margin:14px auto 26px;max-width:460px;color:var(--muted);line-height:1.8}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}a,button{min-height:46px;padding:12px 18px;border-radius:14px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.primary{border:1px solid var(--accent);background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text)}@media(max-width:520px){body{padding:14px}.card{border-radius:22px}.actions{display:grid}.actions>*{width:100%}img{border-radius:30px}}
</style>
</head>
<body>
<main class="card">
<img src="neeton-versions.svg?v=3" data-neeton alt="迷子になったニートン" onerror="this.onerror=null;this.src='neeton.svg?v=3'">
<p class="code">ERROR 404</p>
<h1>ページが見つからないよ</h1>
<p>URLが変わったか、ページがなくなったみたい。ニートンと一緒にホームへ戻ろう。</p>
<div class="actions"><a class="primary" href="./">ホームへ戻る</a><button class="secondary" type="button" onclick="history.length>1?history.back():location.href='./'">ひとつ前へ戻る</button></div>
</main>

</html>
