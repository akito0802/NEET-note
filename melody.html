<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9c7a8"><title>メロディ入力 | NEET NOTE</title><link rel="stylesheet" href="common-ui.css?v=1"><style>:root{--bg:#eee7dc;--paper:#fffdf8;--text:#27231f;--muted:#746b61;--line:#d9cfc1;--accent:#8b6f47;--on:#b9784c}html[data-theme=dark]{--bg:#141311;--paper:#211f1c;--text:#f5efe7;--muted:#b9afa4;--line:#403a34;--accent:#c6a274;--on:#d18c61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.shell{width:min(1180px,calc(100% - 20px));margin:auto;padding:18px 0 70px}.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.head h1{margin:0;font-size:clamp(1.7rem,6vw,2.7rem)}.eyebrow{margin:0;color:var(--muted);font-size:.72rem;font-weight:900;letter-spacing:.14em}.panel{padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 12px 30px rgba(0,0,0,.08)}.tools{display:grid;grid-template-columns:minmax(160px,1fr) repeat(3,minmax(90px,auto));gap:10px;margin-bottom:12px}.tools input,.tools select,.btn{min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;font:inherit}.btn{font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.status{margin:10px 2px;color:var(--muted);font-size:.86rem}.roll-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;overscroll-behavior:contain;background:var(--paper)}.roll{display:grid;grid-template-columns:62px repeat(32,34px);width:max-content}.note-label,.cell,.step{height:30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.note-label{position:sticky;left:0;z-index:2;display:flex;align-items:center;padding-left:9px;background:var(--paper);font-size:.75rem;font-weight:800}.note-label.black{background:color-mix(in srgb,var(--paper) 82%,#000)}.step{display:grid;place-items:center;height:26px;background:var(--paper);color:var(--muted);font-size:.68rem;font-weight:800}.cell{background:color-mix(in srgb,var(--paper) 96%,#000);touch-action:manipulation}.cell.beat{border-left:2px solid color-mix(in srgb,var(--accent) 45%,var(--line))}.cell.on{background:var(--on)}.cell.playing{outline:3px solid #ffd45f;outline-offset:-3px}.saved{display:grid;gap:8px;margin-top:12px}.saved button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;text-align:left}.menu-button{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;font-size:1.25rem}@media(max-width:700px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.shell{width:min(100% - 12px,1180px)}.panel{padding:10px}}</style></head><body><main class="shell"><header class="head"><button id="menuOpenBtn" class="menu-button" type="button">☰</button><div><p class="eyebrow">PIANO ROLL</p><h1>メロディ入力</h1></div></header><section class="panel"><div class="tools"><input id="melodyTitle" maxlength="80" placeholder="メロディ名"><select id="tempo"><option value="70">70 BPM</option><option value="90">90 BPM</option><option value="120" selected>120 BPM</option><option value="140">140 BPM</option><option value="160">160 BPM</option></select><button id="play" class="btn primary">▶ 再生</button><button id="clear" class="btn">消去</button><button id="save" class="btn">保存</button></div><p id="status" class="status">マスをタップして音を置いてね。1マス＝16分音符。</p><div class="roll-wrap"><div id="roll" class="roll"></div></div><div id="saved" class="saved"></div></section></main><script src="common-ui.js?v=20260805b"></script><script src="melody.js?v=1"></script><script src="menu-ui.js?v=20260805-4"></script>

</body></html>
