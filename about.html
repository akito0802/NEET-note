<div><p class="eyebrow">ABOUT NEET NOTE</p><h1>NEET NOTE</h1><p>作曲のアイデア、歌詞、コード進行、録音、制作メモをひとつの場所に残せる音楽制作ノート。思いついた瞬間を逃さず、曲になるまで育てるためのサイトだよ。</p><div class="actions"><a class="primary" href="./">ノートを開く</a><a class="secondary" href="neeton-home.html">ニートンのおうち</a></div></div>
