<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3eadc"><title>ノンダイアトニック判定ツール | NEETNOTE</title><link rel="icon" type="image/svg+xml" href="favicon.svg?v=1"><link rel="stylesheet" href="theory-tools.css?v=20260819-1"></head><body>
<main class="tt-page"><section class="tt-hero"><p class="tt-eyebrow">ANALYSIS / THEORY</p><h1>ノンダイアトニック判定ツール</h1><p>コード進行の中からキー外のコードを色分けし、同主調借用・セカンダリードミナント・導音ディミニッシュ・経過ディミニッシュの可能性を判定します。</p></section><div class="tt-layout"><section class="tt-panel"><div class="tt-field"><label>キー</label><select id="key" class="tt-select"></select></div><div class="tt-field" style="margin-top:10px"><label>コード進行</label><textarea id="prog" class="tt-textarea">C / E7 / Am / F / Fm / C / D7 / G</textarea></div><div class="tt-pillbar" style="margin-top:10px"><button class="tt-btn sample" data-v="C / G / Am / F">基本</button><button class="tt-btn sample" data-v="C / E7 / Am / D7 / G / C">Secondary D</button><button class="tt-btn sample" data-v="C / C7 / F / Fm / C">借用和音</button><button class="tt-btn sample" data-v="C / C#dim7 / Dm / G7 / C">dim</button></div><button id="run" class="tt-btn primary" style="width:100%;margin-top:12px">分析する</button><div id="summary" class="tt-status" style="margin-top:12px"></div></section><section class="tt-panel"><div class="tt-section-title"><h2>分析結果</h2><span>DIATONIC / OUTSIDE</span></div><div id="results" class="tt-analyze"></div></section></div></main>
<script src="theory-tools-core.js?v=20260819-1"></script><script>
(()=>{const T=NEETTheory,$=id=>document.getElementById(id);T.populateKeySelect($('key'));$('key').value='C';function eq(a,b){return a&&b&&a.rootPc===b.rootPc&&a.name===b.name}function degreeName(d){return T.keyMode(T.keyFromId($('key').value))==='minor'?T.romanMinor[d]:T.romanMajor[d]}function classify(ch,i,arr,k){const tri=T.diatonicChords(k,false),sev=T.diatonicChords(k,true),hit=[...tri,...sev].find(x=>eq(x.chord,ch));if(hit)return{type:'diatonic',tag:'ダイアトニック',title:`${hit.roman} / ${hit.function}`,text:`${T.keyLabel(k)} の中にあるコードです。`};const par=T.parallelKey(k),borrow=[...T.diatonicChords(par,false),...T.diatonicChords(par,true)].find(x=>eq(x.chord,ch));if(borrow)return{type:'borrowed',tag:'同主調借用',title:`借用 ${borrow.roman}`,text:`同主調 ${T.keyLabel(par)} から借りたコードとして説明できます。`};const targets=T.diatonicChords(k,false);if(ch.name==='dominant7'||ch.name==='major'){const target=targets.find(x=>(x.chord.rootPc+7)%12===ch.rootPc);if(target){const next=arr[i+1],res=next&&next.rootPc===target.chord.rootPc?`次の ${next.raw} へ実際に解決しています。`:`典型的な解決先は ${target.label}。`;return{type:'secondary',tag:'セカンダリードミナント',title:`V/${degreeName(target.degree)}`,text:`${target.label} を一時的な主和音とみなすドミナント。${res}`}}}if(ch.name==='diminished'||ch.name==='diminished7'||ch.name==='half-diminished'){const target=targets.find(x=>(x.chord.rootPc+11)%12===ch.rootPc);if(target){const next=arr[i+1],res=next&&next.rootPc===target.chord.rootPc?`次の ${next.raw} へ半音上行で解決。`:`解決候補は ${target.label}。`;return{type:'dim',tag:'導音dim',title:`vii°/${degreeName(target.degree)}`,text:`${target.label} の半音下から入る導音ディミニッシュ。${res}`}}const prev=arr[i-1],next=arr[i+1];if(prev&&next){const a=prev.rootPc,b=next.rootPc,m=ch.rootPc;if(((a+1)%12===m&&(m+1)%12===b)||((b+1)%12===m&&(m+1)%12===a))return{type:'dim',tag:'経過dim',title:'半音経過',text:'前後のルートの間を半音でつなぐ経過ディミニッシュの可能性があります。'}}}return{type:'other',tag:'その他の外音',title:'要文脈確認',text:'借用・Secondary Dominant・導音dimの基本ルールには一致しません。旋律的な経過、クロマチック・メディアント、独自の色付けなどを確認してください。'}}
function run(){const k=T.keyFromId($('key').value),tokens=T.tokenizeProgression($('prog').value),arr=tokens.map(T.parseChord),valid=arr.filter(Boolean);let outside=0;const html=arr.map((ch,i)=>{if(!ch)return `<article class="tt-analysis-card other"><header><b>${tokens[i]}</b><span class="tt-chip warn">解析不可</span></header><p>コード名を読み取れませんでした。</p></article>`;const r=classify(ch,i,arr,k);if(r.type!=='diatonic')outside++;return `<article class="tt-analysis-card ${r.type}"><header><b class="tt-code">${ch.raw}</b><span class="tt-chip ${r.type==='diatonic'?'good':r.type==='borrowed'?'strong':'warn'}">${r.tag}</span></header><strong style="display:block;margin-top:6px;font-size:.78rem">${r.title}</strong><p>${r.text}</p></article>`}).join('');$('results').innerHTML=html;$('summary').textContent=`${valid.length}コード中 ${outside}コードがダイアトニック外。外側コードは「間違い」ではなく、色付けや一時的な調性感を作る重要な材料です。`}
$('run').onclick=run;$('key').onchange=run;document.querySelectorAll('.sample').forEach(b=>b.onclick=()=>{$('prog').value=b.dataset.v;run()});run()})();
</script>
