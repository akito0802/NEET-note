<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eadc">
<title>ボイスリーディング・ナビ PRO | NEETNOTE</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="stylesheet" href="voice-leading-pro.css?v=20260820-1">
</head>
<body>
<main class="vl-page">
  <section class="vl-hero">
    <span>HARMONY / ARRANGE TOOL</span>
    <h1>ボイスリーディング・ナビ</h1>
    <p>2コードだけでなく、コード進行全体を4声でつなぎます。「曲で使う」と「理論を学ぶ」を分け、複数候補を聴き比べられるようにしました。</p>
    <div class="vl-hero-actions"><a class="vl-link primary" href="guitar-pro.html">🎸 GUITAR PRO</a><a class="vl-link" href="https://akito0802.github.io/Cordhyo-/index.html">コード辞典</a></div>
  </section>

  <div class="vl-tabs" role="tablist" aria-label="ボイスリーディングのモード">
    <button class="vl-tab active" type="button" role="tab" aria-selected="true" data-mode="arrange">🎧 実用アレンジ</button>
    <button class="vl-tab" type="button" role="tab" aria-selected="false" data-mode="harmony">📚 和声学</button>
  </div>
  <div id="modeHelp" class="vl-mode-help"></div>

  <div class="vl-layout">
    <aside class="vl-panel vl-input">
      <div class="vl-section-head"><div><span>INPUT</span><h2>進行を入力</h2></div><small>4 voices</small></div>
      <label class="vl-field"><span>コード進行</span><textarea id="progression" spellcheck="false">Cmaj7 / Am7 / Dm7 / G7 / Cmaj7</textarea></label>
      <div class="vl-presets">
        <button type="button" data-progression="C / G / Am / F">C-G-Am-F</button>
        <button type="button" data-progression="Cmaj7 / Am7 / Dm7 / G7 / Cmaj7">City / Jazz</button>
        <button type="button" data-progression="F / Fm / C / G7 / C">借用和音</button>
      </div>
      <label class="vl-field"><span>トップノート / メロディ（任意）</span><textarea id="melody" rows="2" spellcheck="false" placeholder="例：E / E / F / F / E"></textarea></label>
      <label class="vl-field"><span>分析キー（和声学用）</span><select id="analysisKey"></select></label>
      <div class="vl-options">
        <label class="vl-check"><input id="commonFixed" type="checkbox" checked>共通音を同じ高さで残す</label>
        <label class="vl-check"><input id="rootBass" type="checkbox">ルート / 指定ベースを最低音に固定</label>
        <label class="vl-check"><input id="avoidParallels" type="checkbox">平行5度・8度を避ける</label>
      </div>
      <button id="analyze" class="vl-primary" type="button">進行全体を最適化</button>
      <div id="error" class="vl-message error" hidden></div>
      <div class="vl-side-note"><b>A/B/Cは「正解順位」ではありません。</b><br>最小移動・トップ優先・広がり重視の3つを比べて、最後は耳で選ぶ設計です。</div>
    </aside>

    <section id="results"></section>
  </div>
</main>
<script src="theory-tools-core.js?v=20260819-1"></script>
<script src="voice-leading-pro.js?v=20260820-1"></script>
<script src="voice-leading-inversion-labels.js?v=20260820-1"></script>























<script src="https://akito0802.github.io/NEET-note/global-menu-v4.js?v=20260821-safe6"></script>
</body>
</html>
