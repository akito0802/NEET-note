      <path fill="#f6c1aa" d="M391 91Q421 80 442 111Q451 135 416 160L393 169Q376 143 354 127Z"/>
      <ellipse cx="256" cy="225" rx="78" ry="59" fill="#ef9f86"/>
      <ellipse cx="228" cy="229" rx="11" ry="20" fill="#2b1b15" stroke="none"/><ellipse cx="284" cy="229" rx="11" ry="20" fill="#2b1b15" stroke="none"/>
      <circle cx="182" cy="190" r="15" fill="#2b1b15" stroke="none"/><circle cx="330" cy="190" r="15" fill="#2b1b15" stroke="none"/>
      <ellipse cx="145" cy="235" rx="24" ry="13" fill="#e99079" opacity=".65" stroke="none"/><ellipse cx="367" cy="235" rx="24" ry="13" fill="#e99079" opacity=".65" stroke="none"/>
      <path fill="url(#book)" d="M115 292Q115 272 136 269L378 263Q399 263 403 284L419 459L104 459Z"/>
      <path fill="#f7c8ad" d="M113 325Q76 343 77 401Q79 449 120 457Q151 461 171 438L155 322Z"/>
      <path fill="#f7c8ad" d="M399 320Q438 337 438 397Q437 445 398 456Q365 462 344 438L359 318Z"/>
      <g fill="none"><path d="M119 294H93M119 326H91M119 358H96M119 390H101"/><path stroke="#f0dfcf" stroke-width="6" d="M93 294Q72 294 72 307Q72 320 93 320M91 326Q68 326 68 340Q68 353 94 353M96 358Q73 358 73 372Q73 386 101 386M101 390Q79 390 79 404Q79 418 106 418"/></g>
    </g>
    <text x="260" y="355" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="52" font-weight="900" fill="#2b1b15">NEETNOTE</text>
    <g stroke="#7f5738" stroke-width="5" opacity=".55"><path d="M179 390H333"/><path d="M179 414H333"/></g>
    <g fill="#2b1b15"><path d="M247 397V446Q247 461 230 465Q212 469 206 456Q201 443 217 435Q227 430 237 433V400Z"/><path d="M247 397L291 387V430Q291 445 275 449Q257 454 251 441Q246 428 262 420Q272 415 281 418V399Z"/></g>
  </symbol>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fffdf8;stroke:#dfcfba;stroke-width:3}.label{font-size:28px;font-weight:800;fill:#5a4637}.tag{font-size:22px;font-weight:900;fill:#6f5c4c}.pig{transform-box:fill-box;transform-origin:center}.lyrics .pig{animation:writeBob 2.2s ease-in-out infinite}.record .pig{animation:singBob 1.25s ease-in-out infinite}.idea .pig{animation:ideaHop 2.4s ease-in-out infinite}.save .pig{animation:walk 2.7s ease-in-out infinite}.error .pig{animation:errorShake 3.4s ease-in-out infinite}.melody .pig{animation:dance 1.7s ease-in-out infinite}.pencil{transform-box:fill-box;transform-origin:50% 90%;animation:pencil 1s ease-in-out infinite}.wave{fill:none;stroke:#88766a;stroke-width:6;stroke-linecap:round;opacity:.65;animation:pulse 1.2s ease-out infinite}.wave.w2{animation-delay:.25s}.bulb{animation:glow 1.6s ease-in-out infinite}.spark{animation:spark 1.4s ease-in-out infinite}.cloud{animation:float 2.1s ease-in-out infinite}.check{animation:check 1.5s ease-in-out infinite}.warning{animation:warn 1.2s ease-in-out infinite}.note{animation:note 2.4s linear infinite}.n2{animation-delay:.7s}.n3{animation-delay:1.3s}.n4{animation-delay:1.8s}@keyframes writeBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}@keyframes pencil{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(7deg) translateY(-5px)}}@keyframes singBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.018)}}@keyframes pulse{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}@keyframes ideaHop{0%,100%{transform:translateY(0) rotate(-2deg)}45%{transform:translateY(-15px) rotate(2deg)}65%{transform:translateY(-5px)}}@keyframes glow{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}@keyframes spark{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}@keyframes walk{0%,100%{transform:translateX(-7px) rotate(-1deg)}50%{transform:translateX(8px) translateY(-5px) rotate(1deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes check{0%,100%{transform:scale(.88)}50%{transform:scale(1.12)}}@keyframes errorShake{0%,68%,100%{transform:translateX(0) rotate(0)}72%{transform:translateX(-8px) rotate(-2deg)}76%{transform:translateX(8px) rotate(2deg)}80%{transform:translateX(-6px) rotate(-1deg)}84%{transform:translateX(5px) rotate(1deg)}88%{transform:translateX(0)}}@keyframes warn{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}@keyframes dance{0%,100%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-8px) rotate(3deg)}50%{transform:translateY(0) rotate(5deg)}75%{transform:translateY(-8px) rotate(-3deg)}}@keyframes note{0%{opacity:0;transform:translateY(24px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-58px) scale(1.1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="1200" rx="70" fill="url(#bg)"/>
<rect x="24" y="24" width="1152" height="1152" rx="54" fill="none" stroke="#dfcfba" stroke-width="4"/>
<text x="70" y="85" font-size="38" font-weight="900" fill="#4d3b2f" letter-spacing="2">NEETON COLLECTION</text>
<text x="72" y="124" font-size="23" fill="#826d5c">歌詞・録音・アイデア・保存・エラー・メロディ</text>

<g class="lyrics" transform="translate(58 170)">
