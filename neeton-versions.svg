  <g class="pig"><use href="#neeton" x="58" y="87" width="230" height="230"/></g>
  <g class="bulb" transform="translate(48 72)" filter="url(#glow)"><circle cx="44" cy="44" r="31" fill="#ffd95b" stroke="#d99b14" stroke-width="5"/><path d="M31 43q13-24 26 0q-8 11-8 27H39q0-16-8-27z" fill="none" stroke="#8d6420" stroke-width="5"/><rect x="34" y="72" width="20" height="12" rx="5" fill="#8d6420"/></g>
