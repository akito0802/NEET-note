<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">ニートンのいろんなバージョン</title>
<desc id="desc">歌詞、録音、アイデア、保存、エラー、メロディの場面で動くニートンのコレクション</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f4eadb"/></linearGradient>
  <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe1d2"/><stop offset="1" stop-color="#f3bca5"/></linearGradient>
  <linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#deb17d"/><stop offset="1" stop-color="#bd8756"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6b4c33" flood-opacity=".16"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <symbol id="neeton" viewBox="0 0 512 512">
    <g stroke="#2b1b15" stroke-width="10" stroke-linejoin="round">
      <path fill="url(#pig)" d="M121 91Q88 71 65 110Q53 142 94 173L111 182Q91 229 103 283Q114 335 155 357L357 357Q399 333 409 281Q419 227 401 182L420 171Q459 139 447 107Q427 69 391 91L354 127Q310 106 256 106Q202 106 158 127Z"/>
