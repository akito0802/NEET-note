<g class="record" transform="translate(429 170)">
  <rect class="card" width="342" height="450" rx="34" filter="url(#shadow)"/><rect x="18" y="18" width="306" height="12" rx="6" fill="#8b7c73"/>
  <g class="pig"><use href="#neeton" x="55" y="73" width="235" height="235"/></g>
  <path d="M125 112q46-58 92 0" fill="none" stroke="#403a38" stroke-width="15" stroke-linecap="round"/><rect x="109" y="111" width="25" height="65" rx="12" fill="#403a38"/><rect x="210" y="111" width="25" height="65" rx="12" fill="#403a38"/>
  <g transform="translate(42 155)"><rect x="0" y="0" width="26" height="78" rx="13" fill="#71655f"/><line x1="13" y1="78" x2="13" y2="112" stroke="#544a46" stroke-width="7"/><line x1="-10" y1="112" x2="36" y2="112" stroke="#544a46" stroke-width="7" stroke-linecap="round"/></g>
  <circle class="wave" cx="63" cy="152" r="32"/><circle class="wave w2" cx="63" cy="152" r="52"/>
