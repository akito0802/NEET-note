  <circle cx="292" cy="58" r="27" fill="#78ad87"/><path class="check" d="M279 58l9 9 18-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="111" y="394" width="120" height="42" rx="21" fill="#f4eadc"/><text class="label" x="171" y="423" text-anchor="middle">保存</text>
</g>

<g class="error" transform="translate(429 650)">
  <rect class="card" width="342" height="450" rx="34" filter="url(#shadow)"/><rect x="18" y="18" width="306" height="12" rx="6" fill="#db7c58"/>
  <g class="pig"><use href="#neeton" x="55" y="82" width="235" height="235"/></g>
  <g class="warning" transform="translate(238 235)"><path d="M45 0l45 78H0z" fill="#f4be43" stroke="#9f6b1d" stroke-width="5"/><rect x="41" y="23" width="8" height="29" rx="4" fill="#5a3c24"/><circle cx="45" cy="64" r="5" fill="#5a3c24"/></g>
  <path d="M92 92l-14-24M116 82l-6-29M238 90l18-21" stroke="#b88c6f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="292" cy="58" r="27" fill="#db7c58"/><text x="292" y="67" text-anchor="middle" font-size="31" font-weight="900" fill="#fff">!</text>
